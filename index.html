function renderCourseMap(map, dls){
  const body = document.getElementById('mapBody');
  if (!map || !map.events) { body.innerHTML = '<div class="note warn">Карта курса пока не заполнена.</div>'; return; }

  // группируем события по неделям
  const weeks = {};
  (map.events||[]).forEach(e => {
    (weeks[e.week_num] = weeks[e.week_num] || { label: e.week_label, events: [] }).events.push(e);
  });

  const now = Date.now();
  const suspendedBanner = map.suspended
    ? `<div class="note err" style="margin-bottom:20px;font-size:15px">
        🚫 <b>Доступ к курсу приостановлен.</b> Вы пропустили два дедлайна. Чтобы возобновить обучение, свяжитесь с методистом.</div>`
    : '';

  const kindStyle = {
    lecture:  { c:'#7B61FF', bg:'#F0ECFF' },
    practicum:{ c:'#E91E8C', bg:'#FDE7F3' },
    deadline: { c:'#FF8C42', bg:'#FFF0E4' },
    project:  { c:'#0EA5E9', bg:'#E0F2FE' },
    exam:     { c:'#DC2626', bg:'#FEE2E2' },
  };

  body.innerHTML = `
    <h1 style="font-size:32px;margin-bottom:6px">🗺 Карта курса</h1>
    <p style="color:var(--gray);margin-bottom:24px">${esc(map.course?.title||'')} — план обучения, лекции и дедлайны</p>
    ${suspendedBanner}
    ${Object.entries(weeks).map(([wn, w]) => `
      <div class="map-week">
        <div class="map-week-label">${esc(w.label||('Неделя '+wn))}</div>
        <div class="map-events">
          ${w.events.map(e => {
            const st = kindStyle[e.kind] || kindStyle.lecture;
            const dt = new Date(e.event_at);
            const dateStr = dt.toLocaleString('ru-RU', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit', timeZone:'Europe/Moscow' });
            const isDeadline = e.kind === 'deadline';
            const ds = e.deadline_status;
            let badge = '';
            if (isDeadline && ds) {
              if (!ds.has_lessons) badge = '';
              else if (ds.complete) badge = '<span class="map-badge ok">✅ сдано</span>';
              else if (ds.overdue) badge = '<span class="map-badge bad">⚠️ просрочено</span>';
              else badge = '<span class="map-badge wait">⏳ в процессе</span>';
            }
            const past = dt.getTime() < now && !isDeadline;
            return `<div class="map-event" style="border-left-color:${st.c};${past?'opacity:.6':''}">
              <div class="map-event-icon" style="background:${st.bg}">${e.emoji||'•'}</div>
              <div style="flex:1">
                <div style="font-weight:800;font-size:15px">${esc(e.title)} ${badge}</div>
                <div style="font-size:12.5px;color:var(--gray);margin-top:2px">${dateStr} МСК</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `).join('')}`;
}

async function startLessonConfirmed(slug){
  window.__lessonStarted = window.__lessonStarted || {};
  window.__lessonStarted[slug] = true;
  // фиксируем старт в БД
  try { await sb.rpc('learn_start_lesson', { p_course_slug: currentCourse, p_lesson_slug: slug }); } catch(_){}
  renderLesson(slug);
}

function renderLesson(slug, keepScroll){
  clearDirty();
  const l = (currentCourseData?.lessons||[]).find(x => x.slug === slug);
  if (!l) { go('course/' + currentCourse); return; }
  if (l.locked) { go('course/' + currentCourse); return; }
  currentLesson = l;
  // модалка «Приступить» — если старт не зафиксирован и это препод (не редактор)
  if (!window.__isEditor && !l.started_at && !l.done_at && !window.__lessonStarted?.[l.slug]) {
    showStartLessonModal(l, keepScroll);
    return;
  }
  show('lesson', keepScroll);
  const body = document.getElementById('lessonBody');
  body.innerHTML = `
    <h1 style="font-size:clamp(22px,3.5vw,28px);margin-bottom:6px">${esc(l.title)}</h1>
    <div style="color:var(--gray);margin-bottom:26px">${esc(l.summary || '')}</div>
    ${(l.blocks||[]).map(b => renderBlock(b)).join('')}
    <div style="text-align:center;margin-top:34px" id="finishBox">
      ${l.done_at
        ? '<div class="note ok">✅ Урок пройден</div>'
        : `<button class="btn btn-green" onclick="finishLesson()">Завершить урок ✓</button>`}
    </div>`;
  // слушатели вешаем ОДИН раз (иначе накапливаются при каждой перерисовке)
  if (!body.dataset.listenersAttached) {
    body.dataset.listenersAttached = '1';
    // любое редактирование в уроке помечает «есть несохранённое»
    body.addEventListener('input', markDirty);
    // автосохранение секций пробника при вводе (debounce 3с) — защита от потери
    body.addEventListener('input', (e) => {
      const secBox = e.target.closest('[id^="exq-"], [id^="exe-"]');
      if (!secBox) return;
      if (window.__isEditor) return;
      // сохраняем ТОЛЬКО ту секцию, где печатали (не все сразу — иначе шквал запросов)
      clearTimeout(window.__examAutosave);
      const boxId = secBox.id;
      window.__examAutosave = setTimeout(() => { autosaveOneSection(boxId); }, 2500);
    });
    body.addEventListener('change', markDirty);
  }
  // запускаем таймер пробника, только если письменная не завершена и это ученик
  const writtenDone = window.__isEditor || !!(l.done_at || l.exam_reviewed);
  const examBlock = (l.blocks||[]).find(bl => bl.type === 'exam' && bl.exam_timer);
  if (examBlock && !writtenDone) initExamTimer(examBlock.id, examBlock.exam_timer);
  else if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
  // подгружаем плееры записей устной части
  loadSpeakingPlayers(l);
  loadExamResults(l);
}


// оценка за задание урока-лекции: показываем преподавателю над заданием
async function loadHomeworkGrade(l){
  const taskBlock = (l.blocks||[]).find(bl => bl.type === 'task');
  if (!taskBlock) return;
  const { data } = await sb.rpc('learn_my_lesson_grade',
    { p_course_slug: currentCourse, p_lesson_slug: l.slug });
  const host = document.getElementById('task-result-' + taskBlock.id)
            || document.getElementById('exam-result-' + taskBlock.id);
  if (!host) return;
  if (!data || !data.graded) {
    if (l.done_at) {
      host.innerHTML = `<div class="exam-pending-banner">
        <div style="font-size:13px;font-weight:800;color:#B45309;text-transform:uppercase;letter-spacing:.5px">⏳ На проверке</div>
        <div style="font-size:14px;margin-top:6px;color:var(--ink)">Работа отправлена методисту. Оценка и комментарий появятся здесь после проверки.</div>
      </div>`;
    }
    return;
  }
  const tasks = (data.tasks || []).filter(t => t.score != null);
  const many = tasks.length > 1;
  host.innerHTML = `<div class="exam-result-banner">
    <div style="font-size:13px;font-weight:800;color:#15803D;text-transform:uppercase;letter-spacing:.5px">✅ Работа проверена</div>
    <div style="font-size:19px;margin-top:6px">Оценка за урок: <b>${data.average}</b> из 100${many?` <span style="font-size:14px;color:var(--gray)">— среднее по ${tasks.length} ${plural(tasks.length,'заданию','заданиям','заданиям')}</span>`:''}</div>
    ${tasks.map(t => `
      <div style="margin-top:12px">
        ${many?`<div style="font-size:13.5px;font-weight:700">${esc(t.title)} — ${t.score} из ${t.max}</div>`:''}
        ${t.comment ? `<div class="ebd-comment"><b style="color:var(--purple-dark)">💬 Комментарий методиста:</b><br>${esc(t.comment)}</div>` : ''}
      </div>`).join('')}
  </div>`;
}

async function loadExamResults(l){
  if (window.__isEditor) return;   // результат — для учителя
  const examBlock = (l.blocks||[]).find(bl => bl.type === 'exam');
  if (!examBlock) { loadHomeworkGrade(l); return; }
  const holder = document.getElementById('exam-result-' + examBlock.id);
  if (!holder) return;
  const { data } = await sb.rpc('learn_exam_result', { p_block_id: examBlock.id });

  // если ещё не проверено — плашка «На проверке» (урок завершён, ждём методиста)
  if (!data || !data.reviewed) {
    // показываем плашку только если урок уже сдан (есть завершение)
    if (l.done_at) {
      holder.innerHTML = `<div class="exam-pending-banner">
        <div style="font-size:13px;font-weight:800;color:#B45309;text-transform:uppercase;letter-spacing:.5px">⏳ На проверке</div>
        <div style="font-size:14px;margin-top:6px;color:var(--ink)">Ваша работа отправлена методисту. Результат появится здесь после проверки — придёт уведомление.</div>
      </div>`;
    }
    return;
  }

  // проверено — результат + разбор
  let line;
  if (data.secondary != null) line = `Первичный балл: <b>${data.primary}</b> из ${data.max} · Тестовый балл: <b>${data.secondary}</b> из 100`;
  else if (data.grade != null) line = `Первичный балл: <b>${data.primary}</b> из ${data.max} · Оценка: <b>${data.grade}</b>`;
  else line = `Балл: <b>${data.primary}</b> из ${data.max}`;

  const tasks = data.tasks || [];
  const breakdown = tasks.length ? `
    <div style="margin-top:14px">
      <button class="fw-toggle" onclick="const b=this.nextElementSibling;b.style.display=b.style.display==='none'?'block':'none';this.textContent=b.style.display==='none'?'📋 Показать разбор по заданиям':'📋 Скрыть разбор'">📋 Показать разбор по заданиям</button>
      <div style="display:none;margin-top:10px" class="exam-breakdown">
        ${tasks.map(t => t.kind === 'auto'
          ? `<div class="ebd-item">
               <span>${esc(t.title)}</span>
               <span class="ebd-score">${t.correct}/${t.total} верно</span>
             </div>`
          : `<div class="ebd-item">
               <span>${esc(t.title)}</span>
               <span class="ebd-score">${t.score!=null?t.score:'—'}${t.max?' / '+t.max:''} балл</span>
             </div>${t.comment?`<div class="ebd-comment"><b style="color:var(--purple-dark)">💬 Комментарий методиста:</b><br>${esc(t.comment)}</div>`:''}`
        ).join('')}
      </div>
    </div>` : '';

  holder.innerHTML = `<div class="exam-result-banner">
    <div style="font-size:13px;font-weight:800;color:#15803D;text-transform:uppercase;letter-spacing:.5px">✅ Работа проверена методистом</div>
    <div style="font-size:19px;margin-top:6px">${line}</div>
    ${breakdown}
  </div>`;
}

async function loadSpeakingPlayers(l){
  const exam = (l.blocks||[]).find(bl => bl.type === 'exam');
  if (!exam || !exam.exam_state) return;
  for (const [key, sub] of Object.entries(exam.exam_state)) {
    if (!key.startsWith('speaking_')) continue;
    const tid = key.replace('speaking_', '');
    const holder = document.getElementById(`sp-player-${exam.id}-${tid}`);
    if (!holder) continue;
    const paths = sub.meta?.parts?.length ? sub.meta.parts : (sub.storage_path ? [sub.storage_path] : []);
    if (!paths.length) { holder.innerHTML = ''; continue; }
    const urls = [];
    let firstErr = null;
    for (const p of paths) {
      try {
        const { data, error } = await sb.storage.from('learn-tasks').createSignedUrl(p, 3600);
        if (error) { firstErr = error.message || String(error); continue; }
        if (data?.signedUrl) urls.push(data.signedUrl);
      } catch(e) { firstErr = e.message || String(e); }
    }
    if (urls.length) {
      holder.innerHTML = `<div style="font-size:12.5px;color:var(--gray);margin-bottom:6px">🎧 Ваша запись (можно переслушать):</div>`
        + urls.map(u => `<audio controls preload="metadata" src="${u}" style="width:100%;margin-bottom:6px"></audio>`).join('');
    } else {
      holder.innerHTML = `<div class="note warn" style="font-size:12.5px">Запись сохранена, но не удалось загрузить плеер${firstErr ? ': ' + esc(firstErr) : ''}.</div>`;
    }
  }
}

function renderBlock(b){
  const p = b.payload || {};
  if (b.type === 'video') {
    let embed = '';
    if (p.provider === 'youtube') {
      const id = (p.url||'').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/)?.[1] || '';
      embed = `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`;
    } else if (p.provider === 'vimeo') {
      const id = (p.url||'').match(/vimeo\.com\/(\d+)/)?.[1] || '';
      embed = `<iframe src="https://player.vimeo.com/video/${id}" allowfullscreen></iframe>`;
    } else if (p.provider === 'storage' || p.path) {
      // файл в бакете learn-media: указываем только путь, ссылка собирается сама
      embed = `<video controls preload="metadata" src="${esc(mediaUrl(p.path || p.url || ''))}"></video>`;
    } else {
      embed = `<video controls src="${esc(p.url||'')}"></video>`;
    }
    return `<div class="block block-video">

// снять отметки с неверно отвеченных вопросов, чтобы ответить заново
function clearWrong(blockId){
  const box = document.getElementById('quiz-' + blockId);
  const block = (currentLesson.blocks||[]).find(x => x.id === blockId);
  const res = block?.submission?.results || {};
  box.querySelectorAll('.q').forEach(qEl => {
    const qi = qEl.dataset.qi;
    if (res[qi] === false) {
      qEl.querySelectorAll('input').forEach(i => i.checked = false);
      qEl.style.borderLeft = '3px solid var(--purple)';
    }
  });
}

// ===== Аудирование: плеер без перемотки, один раз =====
function mediaUrl(path){
  const { data } = sb.storage.from('learn-media').getPublicUrl(path);
  return data.publicUrl;
}

async function playListening(blockId, src){
  const wrap = document.getElementById('audio-wrap-' + blockId);
  const audio = new Audio(src);
  audio.preload = 'auto';

  wrap.innerHTML = `
    <div class="rec-box" style="border-color:var(--purple)">
      <div style="font-weight:800;font-size:15px">🎧 Идёт аудирование</div>
      <div class="rec-time" id="audio-time-${blockId}">0:00</div>
      <div style="font-size:13px;color:var(--gray)">Перемотка и пауза недоступны. Не закрывайте страницу.</div>
    </div>`;

  // запрет перемотки: любой seek возвращаем назад
  let lastTime = 0;
  audio.addEventListener('timeupdate', () => {
    if (audio.currentTime > lastTime + 0.5) { audio.currentTime = lastTime; }
    else lastTime = audio.currentTime;
    const el = document.getElementById('audio-time-' + blockId);
    if (el) el.textContent = fmtSec(Math.floor(audio.currentTime));
  });
  audio.addEventListener('seeking', () => {
    if (audio.currentTime > lastTime + 0.5) audio.currentTime = lastTime;
  });
  // запрет паузы (кроме конца)
  audio.addEventListener('pause', () => {
    if (!audio.ended) audio.play().catch(()=>{});
  });

  audio.addEventListener('ended', async () => {
    wrap.innerHTML = '<div class="note ok">🎧 Аудирование завершено. Переходите к ответам ниже.</div>';
    // фиксируем факт прослушивания
    try { await sb.rpc('learn_submit_exam', {
      p_block_id: blockId, p_section: 'audio', p_kind: 'text',
      p_answers: { played: true }, p_meta: { played_at: new Date().toISOString() }
    }); } catch(_){}
  });

  try {
    await audio.play();
  } catch(e) {
    wrap.innerHTML = `<div class="note err">Не удалось запустить аудио: ${esc(e.message||e)}<br>Проверьте соединение и обновите страницу.</div>`;
  }
}

// ===== Запись микрофона (устная часть) =====
let mediaStream = null, mediaRec = null, recChunks = [], recTimer = null, prepTimer = null;

function pickMime(){
  const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for (const m of cands) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

async function startSpeaking(blockId, task){
  // раскрыть материал задания (текст/картинки), если он был скрыт до старта
  const material = document.getElementById(`sp-material-${blockId}-${task.id}`);
  const locked = document.getElementById(`sp-locked-${blockId}-${task.id}`);
  if (material) material.style.display = 'block';
  if (locked) locked.style.display = 'none';

  const stage = document.getElementById(`sp-stage-${blockId}-${task.id}`);
  stage.style.display = 'block';
  const r = stage.getBoundingClientRect();
  if (r.top < 0 || r.bottom > window.innerHeight) stage.scrollIntoView({ behavior:'smooth', block:'center' });

  // запрос микрофона
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    stage.innerHTML = `<div class="note err">Не удалось получить доступ к микрофону. Разрешите доступ в браузере и попробуйте снова.<br>Либо запись можно приложить файлом ниже.</div>`;
    return;
  }
  const mime = pickMime();
  if (!mime) {
    stage.innerHTML = `<div class="note err">Ваш браузер не поддерживает запись. Откройте пробник в Chrome или приложите готовый аудиофайл.</div>`;
    return;
  }

  // режим задания 3: аудио-вопросы играют, микрофон пишет параллельно
  if (task.audio_path) {
    await runAudioParallel(blockId, task, mime, stage);
    return;
  }

  // серия (perItemSec × items) или одиночная (maxDurationSec)
  const isSeries = !!task.perItemSec;
  const items = isSeries ? (task.items || 1) : 1;
  window.__recBlobs = window.__recBlobs || {};
  window.__recBlobs[task.id] = [];

  await runSpeakingStep(blockId, task, mime, 1, items, stage);
}

// Задание 3: непрерывная запись, поверх играет аудио с вопросами
async function runAudioParallel(blockId, task, mime, stage){
  window.__recBlobs = window.__recBlobs || {};
  window.__recBlobs[task.id] = [];

  const src = mediaUrl(task.audio_path);
  const audio = new Audio(src);
  audio.preload = 'auto';

  // подготовка перед стартом (если задана)
  if (task.prepSec > 0) {
    await countdown(stage, task.prepSec, '⏳ Подготовка', 'Интервью',
      'Сейчас начнётся аудио с вопросами. Отвечайте после каждого — микрофон уже пишет.');
  }

  // явная кнопка старта — гарантирует пользовательский жест для autoplay аудио
  await new Promise((resolveStart) => {
    stage.innerHTML = `
      <div class="rec-box" style="align-items:center">
        <div style="font-weight:800;font-size:15px;margin-bottom:6px">🎧 Готовы начать интервью?</div>
        <div style="font-size:13px;color:var(--gray);margin-bottom:14px">Аудио с вопросами заиграет, микрофон начнёт запись. Отвечайте после каждого вопроса.</div>
        <button class="btn" id="startInterview-${task.id}" style="font-size:16px;padding:13px 30px">▶ Начать интервью</button>
      </div>`;
    document.getElementById('startInterview-'+task.id).onclick = () => resolveStart();
  });

  await new Promise((resolve) => {
    recChunks = [];
    mediaRec = new MediaRecorder(mediaStream, { mimeType: mime });
    mediaRec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = () => {
      window.__recBlobs[task.id].push(new Blob(recChunks, { type: mime }));
      resolve();
    };
    mediaRec.start();

    stage.innerHTML = `
      <div class="rec-box">
        <div class="rec-dot"></div>
        <div style="font-weight:800;font-size:15px">🎧 Интервью идёт — отвечайте на вопросы</div>
        <div class="rec-time" id="rec-time">0:00</div>
        <div style="font-size:13px;color:var(--gray)">Аудио остановится само. Микрофон пишет всё время.</div>
      </div>`;

    let elapsed = 0;
    recTimer = setInterval(() => {
      elapsed++;
      const el = document.getElementById('rec-time');
      if (el) el.textContent = fmtSec(elapsed);
    }, 1000);

    // старт аудио; по окончании — стоп записи
    audio.addEventListener('ended', () => {
      clearInterval(recTimer);
      try { mediaRec.stop(); } catch(_){}
    });
    // запрет перемотки: ловим только резкие скачки (перемотка), не обычный ход
    let lastT = 0;
    audio.addEventListener('timeupdate', () => {
      // нормальное воспроизведение продвигается плавно; перемотка = скачок > 1.5с
      if (audio.currentTime > lastT + 1.5) {
        audio.currentTime = lastT;   // откат перемотки вперёд
      } else {
        lastT = Math.max(lastT, audio.currentTime);
      }
    });
    // запрет перемотки назад через seeking
    audio.addEventListener('seeking', () => {
      if (Math.abs(audio.currentTime - lastT) > 1.5) audio.currentTime = lastT;
    });
    // старт аудио — теперь после клика, autoplay разрешён.
    // если play() всё же упадёт — НЕ рушим запись: даём фиксированное время (по длине аудио или 6 мин)
    audio.play().catch(() => {
      // аудио не запустилось (редко) — запись продолжается, останавливаем по таймауту
      const fallbackSec = Math.round(audio.duration || 360);
      setTimeout(() => { clearInterval(recTimer); try { mediaRec.stop(); } catch(_){} }, fallbackSec*1000);
    });
  });

  finishSpeaking(blockId, task, mime, stage);
}

function __speakingSeriesEntry(){ /* маркер */ }

async function runSpeakingStep(blockId, task, mime, step, total, stage){
  const isSeries = !!task.perItemSec;
  const dur = isSeries ? task.perItemSec : (task.maxDurationSec || 60);
  const label = total > 1 ? `Ответ ${step} из ${total}` : 'Запись';

  // фаза подготовки (только перед первым шагом; у серий подготовка одна на всё задание)
  const prep = (step === 1) ? (task.prepSec || 0) : 0;

  if (prep > 0) {
    await countdown(stage, prep, '⏳ Подготовка', label,
      'Обдумайте ответ. Запись начнётся автоматически.');
  }

  // фаза записи
  await new Promise((resolve) => {
    recChunks = [];
    mediaRec = new MediaRecorder(mediaStream, { mimeType: mime });
    mediaRec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = () => {
      const blob = new Blob(recChunks, { type: mime });
      window.__recBlobs[task.id].push(blob);
      resolve();
    };
    mediaRec.start();

    let left = dur;
    stage.innerHTML = `
      <div class="rec-box">
        <div class="rec-dot"></div>
        <div style="font-weight:800;font-size:15px">${label} — идёт запись</div>
        <div class="rec-time" id="rec-time">${fmtSec(left)}</div>
        <button class="btn btn-ghost" style="padding:8px 18px" onclick="stopRec()">Стоп</button>
      </div>`;
    window.__stopRec = () => { try{ mediaRec.stop(); }catch(_){} clearInterval(recTimer); };
    recTimer = setInterval(() => {
      left--;
      const el = document.getElementById('rec-time');
      if (el) el.textContent = fmtSec(left);
      if (left <= 0) { clearInterval(recTimer); window.__stopRec(); }
    }, 1000);
  });

  // следующий шаг серии или финал
  if (step < total) {
    await runSpeakingStep(blockId, task, mime, step + 1, total, stage);
  } else {
    finishSpeaking(blockId, task, mime, stage);
  }
}

function stopRec(){ if (window.__stopRec) window.__stopRec(); }

function countdown(stage, sec, title, sub, hint){
  return new Promise(resolve => {
    let left = sec;
    const draw = () => {
      stage.innerHTML = `<div class="rec-box prep">
        <div style="font-weight:800;font-size:15px">${title} · ${sub}</div>
        <div class="rec-time">${fmtSec(left)}</div>
        <div style="font-size:13px;color:var(--gray)">${hint||''}</div>
        <button class="btn" style="padding:8px 18px" onclick="window.__skipPrep&&window.__skipPrep()">Готов, начать сейчас</button>
      </div>`;
    };
    draw();
    window.__skipPrep = () => { clearInterval(prepTimer); resolve(); };
    prepTimer = setInterval(() => {
      left--; 
      if (left <= 0) { clearInterval(prepTimer); resolve(); }
      else draw();
    }, 1000);
  });
}

async function finishSpeaking(blockId, task, mime, stage){
  // берём только непустые куски: пустая запись = микрофон не сработал
  const blobs = (window.__recBlobs[task.id] || []).filter(b => b && b.size > 1000);
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

  // ЗАЩИТА: без файла сдачу не создаём — иначе препод думает, что сдал, а записи нет
  if (!blobs.length) {
    stage.innerHTML = `
      <div class="note err"><b>Запись не получилась — ответ не отправлен.</b><br>
      Микрофон не записал звук. Проверьте, что браузеру разрешён доступ к микрофону
      (значок замка слева в адресной строке), и запишите ответ заново.</div>
      <div style="margin-top:10px">
        <button class="btn" style="padding:10px 20px;font-size:14px"
          onclick='startSpeaking("${blockId}", ${JSON.stringify(task).replace(/'/g,"&#39;")})'>🎤 Записать заново</button>
      </div>`;
    return;
  }

  stage.innerHTML = `<div class="rec-box"><div style="font-weight:800">⬆ Загружаю запись…</div></div>`;

  try {
    const { data:{ session } } = await sb.auth.getSession();
    const uid = session.user.id;
    const ext = mime.includes('mp4') ? 'mp4' : mime.includes('ogg') ? 'ogg' : 'webm';
    const paths = [];
    for (let i = 0; i < blobs.length; i++) {
      const path = `${uid}/${blockId}/speaking_${task.id}_${i+1}_${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from('learn-tasks').upload(path, blobs[i], { contentType: mime });
      if (upErr) throw upErr;
      paths.push(path);
    }
    if (!paths.length) throw new Error('файл не загрузился');
    const { error } = await sb.rpc('learn_submit_exam', {
      p_block_id: blockId, p_section: 'speaking_' + task.id, p_kind: 'audio',
      p_answers: {}, p_storage: paths[0], p_mime: mime,
      p_meta: { task: task.id, parts: paths, count: paths.length }
    });
    if (error) throw error;
    markLocalSubmission(blockId, 'speaking_' + task.id,
      { storage_path: paths[0], meta: { task: task.id, parts: paths, count: paths.length }, review_status: 'pending' });
    // НЕ перерисовываем урок целиком: это стирало бы незаполненные секции.
    // Запись дошла — перезапись не предлагаем, чтобы не переписывали случайно.
    stage.innerHTML = `<div class="note ok">✅ Запись отправлена методисту.</div>`;
  } catch(e) {
    // файл не долетел — вот здесь перезапись нужна
    stage.innerHTML = `
      <div class="note err"><b>Запись не загрузилась.</b><br>${esc(e.message||e)}<br>
      Проверьте интернет и запишите ответ заново — сейчас ответ не сохранён.</div>
      <div style="margin-top:10px">
        <button class="btn" style="padding:10px 20px;font-size:14px"
          onclick='startSpeaking("${blockId}", ${JSON.stringify(task).replace(/'/g,"&#39;")})'>🎤 Записать заново</button>
      </div>`;
  }
}

function fmtSec(s){ s = Math.max(0, s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

let examTimerInterval = null;

function renderExam(b){
  const p = b.payload || {};
  const st = b.exam_state || {};
  const timer = b.exam_timer || null;
  const secs = p.sections || [];
  const hasTimer = !!p.written_timer_sec;
  const started = !!timer;
  const preview = !!window.__isEditor;   // методист — режим предпросмотра
  const revisionOpen = !preview && !!(currentCourseData && currentCourseData.revision_open);

  // экран «Начать тест» — только для ученика (не для предпросмотра)
  if (hasTimer && !started && !preview) {
    return `<div class="block">
      <div class="exam-head">
        <h2 style="font-size:22px;margin-bottom:8px">📝 ${esc(p.title || 'Пробник')}</h2>
        ${p.intro_html ? `<div class="block-text">${p.intro_html}</div>` : ''}
        <div class="note warn" style="margin-top:14px">
          ⏱ На письменную часть даётся <b>${Math.round(p.written_timer_sec/60)} минут</b>.
          Таймер запустится по кнопке и будет идти непрерывно — даже если закроете страницу.
          Когда время выйдет, ответы автоматически отправятся, а поля заблокируются.
        </div>
        <div style="text-align:center;margin-top:20px">
          <button class="btn" style="font-size:17px;padding:16px 40px" onclick="startExam('${b.id}')">▶ Начать тест</button>
        </div>
        <div style="font-size:13px;color:var(--gray);text-align:center;margin-top:10px">
          Устная часть — без общего таймера, у каждого задания свой.
        </div>
      </div>
    </div>`;
  }

  // письменная часть завершена, если урок пройден или экзамен проверен; для методиста — предпросмотр без таймера
  const writtenDone = preview || !!(currentLesson && (currentLesson.done_at || currentLesson.exam_reviewed));
  const expired = timer && timer.expired && !writtenDone;

  return `<div class="block" id="exam-${b.id}" data-expired="${expired?1:0}" data-done="${writtenDone?1:0}">
    ${hasTimer && !writtenDone ? `<div class="exam-timer" id="exam-timer-${b.id}">⏱ <span id="tval-${b.id}">--:--</span></div>` : ''}
    ${preview ? '<div class="note" style="margin-bottom:14px">👁 Режим предпросмотра — вы видите урок как методист. Ответы не сохраняются.</div>' : ''}
    ${revisionOpen ? `<div class="note warn" style="margin-bottom:14px"><b>✏️ Работа открыта для доработки.</b> ${currentCourseData.revision_note?esc(currentCourseData.revision_note):'Дозаполните или перезапишите задания и отправьте снова.'} Ваш статус «пройдено» сохранён.</div>` : ''}
    <div id="exam-result-${b.id}"></div>
    <div class="exam-head">
      <h2 style="font-size:22px;margin-bottom:8px">📝 ${esc(p.title || 'Пробник')}</h2>
      ${p.intro_html ? `<div class="block-text">${p.intro_html}</div>` : ''}
      ${expired ? '<div class="note err" style="margin-top:14px"><b>⏱ Время письменной части истекло.</b> Ответы сохранены. Устную часть можно выполнить ниже.</div>' : ''}
    </div>
    ${secs.map((sec, si) => {
      const div = sec.divider ? `<div class="exam-divider"><span>${esc(sec.divider)}</span></div>` : '';
      return div + renderSection(b.id, sec, si, st);
    }).join('')}
  </div>`;
}

function initExamTimer(blockId, timer){
  if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
  if (!timer) return;
  if (timer.expired) return;   // время уже истекло — таймер не нужен
  const deadline = new Date(timer.deadline_at).getTime();
  const serverOffset = Date.now() - new Date(timer.server_now).getTime();
  const tick = () => {
    const left = Math.max(0, Math.round((deadline - (Date.now() - serverOffset)) / 1000));
    const el = document.getElementById('tval-' + blockId);
    const box = document.getElementById('exam-timer-' + blockId);
    if (el) el.textContent = fmtClock(left);
    if (box) box.classList.toggle('danger', left <= 300);
    if (left <= 0) {
      clearInterval(examTimerInterval); examTimerInterval = null;
      onExamExpire(blockId);
    }
  };
  tick();
  examTimerInterval = setInterval(tick, 1000);
}

function fmtClock(s){
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return (h>0 ? h+':' : '') + String(m).padStart(h>0?2:1,'0') + ':' + String(sec).padStart(2,'0');
}

async function startExam(blockId){
  const { error } = await sb.rpc('learn_exam_start', { p_block_id: blockId });
  if (error) { alert('Не получилось: ' + error.message); return; }
  refreshLesson();
}

async function onExamExpire(blockId){
  // обрабатываем истечение времени ровно один раз:
  // иначе автосдача → перерисовка → таймер снова видит 0 → бесконечный цикл,
  // из-за которого страница дёргается и её невозможно прокрутить
  window.__expiredHandled = window.__expiredHandled || {};
  if (window.__expiredHandled[blockId]) return;
  window.__expiredHandled[blockId] = true;

  await autoSubmitWritten(blockId);
  const box = document.getElementById('exam-' + blockId);
  if (box) {
    box.querySelectorAll('input, textarea, [contenteditable]').forEach(el => {
      if (el.closest('.sp-task')) return;
      el.setAttribute('disabled', 'true');
      if (el.hasAttribute('contenteditable')) el.setAttribute('contenteditable', 'false');
    });
  }
  const tbox = document.getElementById('exam-timer-' + blockId);
  if (tbox) tbox.innerHTML = '⏱ время письменной части истекло';
  // урок НЕ перерисовываем — устная часть остаётся доступной
}

async function autoSubmitWritten(blockId){
  const box = document.getElementById('exam-' + blockId);
  if (!box) return;
  for (const q of box.querySelectorAll('[id^="exq-' + blockId + '-"]')) {
    const si = q.id.split('-').pop();
    try { await submitExamQuiz(blockId, si); } catch(_){}
  }
  for (const e of box.querySelectorAll('[id^="exe-' + blockId + '-"]')) {
    const si = e.id.split('-').pop();
    try { await submitExamExact(blockId, si); } catch(_){}
  }
}

// ключ секции в exam_state: тип + индекс (несколько секций одного типа не конфликтуют)
function secKey(sec, si){
  if (sec.kind === 'auto_quiz') return 'quiz_' + si;
  if (sec.kind === 'exact_input') return 'exact_' + si;
  if (sec.kind === 'writing') return 'writing_' + si;
  if (sec.kind === 'reflection') return 'reflection';
  if (sec.kind === 'audio') return 'audio';
  return sec.kind + '_' + si;
}

      <div style="display:flex;flex-direction:column;gap:14px">

          const key = 'speaking_' + t.id;

            })()}
            ${(s?.meta?.parts?.length || s?.storage_path) ? `<div id="sp-player-${blockId}-${t.id}" style="margin-top:12px"><div style="font-size:12.5px;color:var(--gray)">🎧 Загружаю вашу запись…</div></div>` : ''}

function sectionWrap(icon, title, note, inner){
  return `<div class="qbox" style="margin-bottom:18px">
    <h3>${icon} ${esc(title||'')}</h3>
    ${note?`<div style="font-size:13px;color:var(--gray);margin-bottom:14px">${esc(note)}</div>`:''}
    ${inner}</div>`;
}
function renderExamQuestion(blockId, q, qi, res, s){
  const ans = s?.answers || {};
  const mark = res ? res[qi] : undefined;
  const badge = mark===false?'<span class="bad">неверно</span>':mark===true?'<span class="good">верно</span>':'';
  return `<div class="q" data-qi="${qi}" style="${mark===false?'border-left:3px solid var(--red);padding-left:12px':''}">
    <div class="qt">${esc(q.q)}${badge}</div>
    ${(q.options||[]).map((o,oi)=>`<label class="opt">
      <input type="${q.type==='multi'?'checkbox':'radio'}" name="eq-${blockId}-${qi}" value="${oi}"
        ${(ans[qi]||[]).includes(oi)?'checked':''}><span>${esc(o)}</span></label>`).join('')}
  </div>`;
}

// автосохранение ОДНОЙ секции (по id контейнера) — лёгкое, при вводе
async function autosaveOneSection(boxId){
  const box = document.getElementById(boxId);
  if (!box) return;
  const mq = boxId.match(/^exq-(.+)-(\d+)$/);
  const me = boxId.match(/^exe-(.+)-(\d+)$/);
  try {
    if (mq) {
      const [, blockId, si] = mq;
      const answers = {}; let hasAny = false;
      box.querySelectorAll('.q').forEach((qEl, idx) => {
        const qi = qEl.dataset.qi ?? idx;
        const checked = [...qEl.querySelectorAll('input:checked')].map(i => parseInt(i.value));
        answers[qi] = checked;
        if (checked.length) hasAny = true;
      });
      if (hasAny) {
        await sb.rpc('learn_submit_exam',
          { p_block_id: blockId, p_section: 'quiz_' + si, p_kind: 'quiz', p_answers: answers, p_meta: { si: +si, auto: true } });
        markLocalSubmission(blockId, 'quiz_' + si, { answers });
      }
    } else if (me) {
      const [, blockId, si] = me;
      const answers = {}; let hasAny = false;
      box.querySelectorAll('.exe-field').forEach(f => {
        answers[f.dataset.ii] = f.value.trim();
        if (f.value.trim()) hasAny = true;
      });
      box.querySelectorAll('.seq-table').forEach(t => {

// автосохранение ВСЕХ секций пробника перед завершением (защита от потери)
async function autosaveAllExamSections(){
  const saves = [];
  // quiz-секции
  document.querySelectorAll('[id^="exq-"]').forEach(box => {
    const m = box.id.match(/^exq-(.+)-(\d+)$/);
    if (!m) return;
    const blockId = m[1], si = m[2];
    const answers = {};
    let hasAny = false;
    box.querySelectorAll('.q').forEach((qEl, idx) => {
      const qi = qEl.dataset.qi ?? idx;
      const checked = [...qEl.querySelectorAll('input:checked')].map(i => parseInt(i.value));
      answers[qi] = checked;
      if (checked.length) hasAny = true;
    });
    if (hasAny) saves.push(sb.rpc('learn_submit_exam',
      { p_block_id: blockId, p_section: 'quiz_' + si, p_kind: 'quiz', p_answers: answers, p_meta: { si: +si, auto: true } }));
  });
  // exact-секции
  document.querySelectorAll('[id^="exe-"]').forEach(box => {
    const m = box.id.match(/^exe-(.+)-(\d+)$/);
    if (!m) return;
    const blockId = m[1], si = m[2];
    const answers = {};
    let hasAny = false;
    box.querySelectorAll('.exe-field').forEach(f => {
      answers[f.dataset.ii] = f.value.trim();
      if (f.value.trim()) hasAny = true;
    });
    box.querySelectorAll('.seq-table').forEach(t => {
      const seq = [...t.querySelectorAll('.seq-box')].map(b => b.value.trim()).join('');
      answers[t.dataset.ii] = seq;
      if (seq) hasAny = true;
    });
    if (hasAny) saves.push(sb.rpc('learn_submit_exam',
      { p_block_id: blockId, p_section: 'exact_' + si, p_kind: 'exact', p_answers: answers, p_meta: { si: +si, auto: true } }));
  });
  if (saves.length) { try { await Promise.all(saves); } catch(_){} }
}

function fileChip(f, blockId, idx, locked){
  const kb = f.size ? (f.size > 1048576 ? (f.size/1048576).toFixed(1)+' МБ' : Math.round(f.size/1024)+' КБ') : '';
  const icon = /\.(mp4|mov|webm)$/i.test(f.name) ? '🎬'
             : /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name) ? '🖼️'
             : /\.pdf$/i.test(f.name) ? '📕'
             : /\.(doc|docx)$/i.test(f.name) ? '📘'
             : /\.(ppt|pptx)$/i.test(f.name) ? '📙' : '📄';
  return `<div class="fchip" data-idx="${idx}">
    <span>${icon} ${esc(f.name)}${kb ? ` · ${kb}` : ''}</span>
    ${locked ? '' : `<button type="button" onclick="removeFile('${blockId}',${idx})" title="Удалить">✕</button>`}
  </div>`;
}

async function submitTask(blockId){
  const ed = document.getElementById('task-' + blockId);
  const html = ed.innerHTML.trim();
  const list = edFiles[blockId] || [];
  if ((!html || html === '<br>') && !list.length) { alert('Напишите ответ или прикрепите файл.'); return; }

  const btn = document.getElementById('taskBtn-' + blockId);
  if (btn) { btn.disabled = true; btn.textContent = 'Отправляю…'; }

  try {
    const { data: { session } } = await sb.auth.getSession();
    const uid = session.user.id;
    const files = [];
    for (const f of list) {
      if (f.uploaded && f.path) { files.push({ path: f.path, name: f.name, size: f.size, type: f.type }); continue; }
      const safe = f.name.replace(/[^\w.\-]+/g, '_');
      const path = `${uid}/${blockId}/${Date.now()}_${safe}`;
      const { error: upErr } = await sb.storage.from('learn-tasks').upload(path, f.file, { upsert: false });

      { p_block_id: blockId, p_answers: { html, files } });

    clearDirty();
    markLocalSubmission(blockId, 'task', { answers: { html, files }, review_status: 'pending' });

// ===== Проверка заполненности перед завершением урока =====
// Собирает список секций, по которым нет ответа: ни сохранённого, ни введённого на экране.
function collectMissingSections(){
  const missing = [];
  const blocks = (currentLesson && currentLesson.blocks) || [];
  for (const b of blocks) {
    if (b.type !== 'exam') continue;
    const st = b.exam_state || {};
    const secs = (b.payload && b.payload.sections) || [];
    secs.forEach((sec, si) => {
      const kind = sec.kind;
      if (kind === 'audio') return;                     // прослушивание, отвечать нечего
      const key = secKey(sec, si);
      const saved = st[key];
      const title = sec.title || sec.divider || 'Задание';

      if (kind === 'speaking') {
        // у устного каждое задание отдельно
        (sec.tasks || []).forEach(t => {
          const s = st['speaking_' + t.id];
          const hasRec = s && (s.storage_path || (s.meta && s.meta.parts && s.meta.parts.length));
          if (!hasRec) missing.push(t.label || ('Устное задание ' + t.id));
        });
        return;
      }

      // есть сохранённый непустой ответ?
      let hasSaved = false;
      if (saved) {
        const a = saved.answers || {};
        if (kind === 'writing' || kind === 'reflection') {
          hasSaved = !!(saved.storage_path || (a.text && String(a.text).trim()));
        } else {
          hasSaved = Object.entries(a).some(([k, v]) =>
            k !== '__results' && v !== '' && v !== null &&
            !(Array.isArray(v) && v.length === 0));
        }
      }
      if (hasSaved) return;

      // ответа нет — проверим, введено ли что-то прямо сейчас на экране
      let typed = false;
      if (kind === 'auto_quiz') {
        const box = document.getElementById('exq-' + b.id + '-' + si);
        typed = !!(box && box.querySelector('input:checked'));
      } else if (kind === 'exact_input') {
        const box = document.getElementById('exe-' + b.id + '-' + si);
        if (box) typed = [...box.querySelectorAll('.exe-field, .seq-box')].some(f => f.value.trim());
      } else if (kind === 'writing') {
        const ta = document.getElementById(`wr-ta-${b.id}-${key}`);
        typed = !!(ta && ta.value.trim()) || !!wrPhotoFiles[b.id + key];
      } else if (kind === 'reflection') {
        const ta = document.getElementById('refl-' + b.id);
        typed = !!(ta && ta.value.trim());
      }
      if (!typed) missing.push(title);
    });
  }
  return missing;
}

function showMissingConfirm(missing){
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'cd-overlay';
    ov.innerHTML = `<div class="cd-modal" style="max-width:520px">
      <h2 style="font-size:20px;margin:0 0 10px">Не всё заполнено</h2>
      <p style="color:var(--gray);font-size:14px;margin-bottom:12px">
        По этим заданиям нет ответа. Если завершить сейчас, они уйдут на проверку пустыми.</p>
      <div class="md-list" style="margin-bottom:16px">
        ${missing.map(m => `<div class="md-item"><span>⚠️ ${esc(m)}</span></div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="mc-back" style="padding:12px 22px">Вернуться и заполнить</button>
        <button class="btn btn-ghost" id="mc-go" style="padding:12px 22px">Всё равно завершить</button>

}

let __finishing = false;
async function finishLesson(){
  if (__finishing) return;   // защита от повторных кликов
  __finishing = true;
  // защита от потери: досохраняем все заполненные секции пробника
  await autosaveAllExamSections();
  // подтягиваем свежее состояние сдач (без перерисовки урока — ввод не трогаем),
  // иначе проверка может решить, что задание не сдано
  try {
    const { data } = await sb.rpc('learn_course_view', { p_course_slug: currentCourse });
    const fresh = (data && data.lessons || []).find(x => x.slug === currentLesson.slug);
    if (fresh && fresh.blocks) {
      fresh.blocks.forEach(fb => {
        const b = (currentLesson.blocks || []).find(x => x.id === fb.id);
        if (b) b.exam_state = fb.exam_state || b.exam_state;
      });
    }
  } catch(_){}
  // предупреждаем, если что-то осталось незаполненным
  const missing = collectMissingSections();
  if (missing.length) {
    const go = await showMissingConfirm(missing);
    if (!go) { __finishing = false; return; }
  }
  const { data, error } = await sb.rpc('learn_complete_lesson',
    { p_course_slug: currentCourse, p_lesson_slug: currentLesson.slug });
  if (error) { alert('Не получилось: ' + error.message); __finishing = false; return; }
  if (!data.ok) {
    document.getElementById('finishBox').innerHTML =
      `<div class="note warn">${esc(data.reason)}</div>
       <div style="margin-top:12px"><button class="btn btn-green" onclick="finishLesson()">Проверить ещё раз</button></div>`;
    __finishing = false;
    return;
  }
  // урок сдан — таймер письменной части больше не нужен
  if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
  const tb = document.querySelector('.exam-timer');
  if (tb) tb.remove();
  // мини-опрос (модалка показывается один раз)
  showLessonFeedback(currentCourse, currentLesson.slug, data.course_done);
}

  if (!fbStars) { alert('Пожалуйста, поставьте оценку от 1 до 5 звёзд.'); return; }
  __submittingFb = true;
  const comment = document.getElementById('fbComment').value.trim() || null;
  try { await sb.rpc('learn_submit_feedback', {
    p_course_slug: courseSlug, p_lesson_slug: lessonSlug, p_stars: fbStars, p_comment: comment
  }); } catch(_){}
  const ov = document.getElementById('fbOverlay');
  if (ov) ov.remove();
  __submittingFb = false;
  __finishing = false;
  if (courseDone) alert('🎉 Курс пройден!');
  await openCourse(courseSlug);
}

async function refreshLesson(){
  const scrollY = window.scrollY;   // запомнить позицию
  const { data } = await sb.rpc('learn_course_view', { p_course_slug: currentCourse });
  currentCourseData = data;
  const l = (data.lessons||[]).find(x => x.slug === currentLesson.slug);
  if (l) { currentLesson = l; renderLesson(l.slug, true); }   // true = не скроллить наверх
  window.scrollTo({ top: scrollY });                          // вернуть позицию
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function fmtHours(h){
  if (h == null) return '—';
  const totalMin = Math.round(Number(h) * 60);
  const hh = Math.floor(totalMin / 60);
  const mm = totalMin % 60;
  if (hh === 0) return mm + 'м';
  if (mm === 0) return hh + 'ч';
  return hh + 'ч ' + mm + 'м';
}
