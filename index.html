<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7B61FF">
<title>WowSpeak Learn 🦉</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B61FF; --purple-dark:#5A45D9; --purple-light:#F0ECFF;
  --orange:#FF8C42; --orange-light:#FFE8D6;
  --pink:#E91E8C; --green:#22C55E; --green-light:#DCFCE7;
  --red:#EF4444; --red-light:#FEE2E2; --yellow:#F59E0B; --yellow-light:#FEF3C7;
  --cream:#FFFBF2; --cream-dark:#F5EFE2;
  --dark:#2D2D3F; --gray:#5A5A6E; --white:#fff;
  --radius:14px; --radius-lg:22px;
  --shadow-sm:0 1px 3px rgba(45,45,63,.06); --shadow:0 8px 28px rgba(45,45,63,.12);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:inherit}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--dark);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle, rgba(123,97,255,.05) 1px, transparent 1px);background-size:26px 26px}
h1,h2,h3{font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.25}
a{color:var(--purple);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}

.header{position:sticky;top:0;z-index:40;background:rgba(255,251,242,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--cream-dark)}
.header .wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.logo{font-family:'Fredoka',sans-serif;font-size:22px;color:var(--purple);font-weight:600}
.header .me{font-size:13px;color:var(--gray)}
.header .me button{background:none;border:none;color:var(--purple);font-weight:800;font-size:13px}

.card{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--radius-lg);
  padding:28px 30px;box-shadow:var(--shadow-sm);margin-bottom:20px}

/* login */
#login{display:none;max-width:420px;margin:80px auto;text-align:center}
#login input{width:100%;padding:13px 14px;border:2px solid var(--cream-dark);border-radius:var(--radius);
  font-size:16px;background:#FDFCF8;margin-bottom:12px}
#login button.go{width:100%;padding:14px;border:none;border-radius:999px;font-weight:800;font-size:16px;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff}
#login .msg{margin-top:12px;font-size:14px;font-weight:700;color:var(--red);display:none}

/* каталог */
#catalog{display:none;padding:34px 0 80px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.course{background:#fff;border:1px solid var(--cream-dark);border-radius:var(--radius-lg);padding:24px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.course:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.course .emo{font-size:40px;margin-bottom:10px}
.course h3{font-size:19px;margin-bottom:5px}
.course .sub{font-size:13.5px;color:var(--gray);flex:1;margin-bottom:14px}
.bar{height:8px;background:var(--cream-dark);border-radius:999px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--pink))}
.course .meta{font-size:12px;color:var(--gray);font-weight:700;display:flex;justify-content:space-between}
.badge-done{background:var(--green-light);color:#15803D;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px}

/* курс */
#course{display:none;padding:30px 0 80px}
.back{font-size:13.5px;font-weight:800;color:var(--gray);display:inline-block;margin-bottom:16px}
.course-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}
.course-head .emo{font-size:52px}
.course-head h1{font-size:clamp(24px,4vw,32px)}
.course-head .sub{color:var(--gray);font-size:16px;margin-top:4px}

.lesson-item{background:#fff;border:2px solid var(--cream-dark);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .15s}
.lesson-item:hover{border-color:var(--purple)}
.lesson-item.locked{opacity:.55;cursor:not-allowed;background:#FAF8F3}
.lesson-item.locked:hover{border-color:var(--cream-dark)}
.lesson-item.done{border-color:var(--green);background:var(--green-light)}
.lesson-item .n{width:32px;height:32px;border-radius:50%;background:var(--cream-dark);color:var(--gray);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.lesson-item.done .n{background:var(--green);color:#fff}
.lesson-item .t{flex:1}
.lesson-item .t b{font-size:15.5px;display:block}
.lesson-item .t span{font-size:13px;color:var(--gray)}

/* урок */
#lesson{display:none;padding:30px 0 80px}
.block{margin-bottom:26px}
.block-video iframe,.block-video video{width:100%;aspect-ratio:16/9;border:none;border-radius:var(--radius);background:#000}
.block-text{font-size:16px;line-height:1.75}
.block-text h3{margin:18px 0 8px}
.block-text ul,.block-text ol{margin:10px 0 10px 22px}
.block-text p{margin-bottom:12px}

.qbox{background:#fff;border:2px solid var(--cream-dark);border-radius:var(--radius-lg);padding:24px 26px}
.qbox h3{font-size:18px;margin-bottom:16px}
.q{margin-bottom:22px}
.q .qt{font-weight:800;font-size:15.5px;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:2px solid var(--cream-dark);
  border-radius:12px;margin-bottom:8px;cursor:pointer;background:#FDFCF8;font-size:14.5px}
.opt:hover{border-color:var(--purple)}
.opt input{margin-top:3px;accent-color:var(--purple);width:17px;height:17px}
.opt.correct{border-color:var(--green);background:var(--green-light)}
.opt.wrong{border-color:var(--red);background:var(--red-light)}
.q textarea{width:100%;padding:12px 14px;border:2px solid var(--cream-dark);border-radius:12px;
  font-size:15px;background:#FDFCF8;min-height:100px;resize:vertical}
.explain{font-size:13.5px;color:var(--gray);background:var(--cream);border-radius:10px;padding:10px 14px;margin-top:8px}

/* редактор задания */
.editor{border:2px solid var(--cream-dark);border-radius:var(--radius);overflow:hidden;background:#FDFCF8;transition:border-color .15s,box-shadow .15s}
.editor:focus-within{border-color:var(--purple);box-shadow:0 0 0 4px var(--purple-light)}
.editor.locked{opacity:.7;background:#FAF8F3}
.toolbar{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--cream-dark);background:#fff;flex-wrap:wrap}
.toolbar button{width:34px;height:32px;border:none;background:none;border-radius:8px;font-size:14px;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center}
.toolbar button:hover{background:var(--purple-light);color:var(--purple-dark)}
.ed{min-height:120px;max-height:420px;overflow-y:auto;padding:14px 16px;font-size:15px;line-height:1.65;outline:none}
.ed:empty:before{content:attr(data-ph);color:#9A9AA8}
.ed h3{font-size:17px;margin:10px 0 6px}
.ed blockquote{border-left:3px solid var(--purple);margin:8px 0;padding:2px 0 2px 14px;color:var(--gray)}
.ed ul,.ed ol{margin:8px 0 8px 22px}

/* файлы */
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fchip{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700}
.fchip button{background:none;border:none;color:var(--gray);font-size:15px;cursor:pointer;padding:2px 6px;border-radius:6px}
.fchip button:hover{background:var(--red-light);color:var(--red)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:12px;padding:18px;border:2px dashed var(--cream-dark);border-radius:var(--radius);cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--purple);background:var(--purple-light)}
.drop span:first-child{font-weight:800;font-size:14.5px;color:var(--purple-dark)}
.drop .hint{font-size:12px;color:var(--gray);font-weight:600}

/* пробник */
.exam-head{background:#fff;border:2px solid var(--purple);border-radius:var(--radius-lg);padding:22px 26px;margin-bottom:18px}
.exam-divider{display:flex;align-items:center;gap:14px;margin:28px 0 16px}
.exam-divider:before,.exam-divider:after{content:'';flex:1;height:2px;background:var(--cream-dark)}
.exam-divider span{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;color:var(--purple-dark);white-space:nowrap}
.q .bad{font-size:12px;font-weight:800;color:var(--red);background:var(--red-light);border-radius:999px;padding:2px 10px;margin-left:8px}
.q .good{font-size:12px;font-weight:800;color:#15803D;background:var(--green-light);border-radius:999px;padding:2px 10px;margin-left:8px}
.wr-tabs{display:flex;gap:8px;margin:14px 0 12px}
.wr-tab{border:2px solid var(--cream-dark);background:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:800;color:var(--gray)}
.wr-tab.on{border-color:var(--purple);background:var(--purple-light);color:var(--purple-dark)}
.sp-task{border:2px solid var(--cream-dark);border-radius:var(--radius);padding:16px 18px}
.sp-done{background:var(--green-light);color:#15803D;font-size:12px;font-weight:800;border-radius:999px;padding:6px 14px;white-space:nowrap}
.rec-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;margin-top:14px;border:2px solid var(--purple);border-radius:var(--radius);background:var(--purple-light);text-align:center}
.rec-box.prep{border-color:var(--orange);background:var(--orange-light)}
.rec-time{font-family:'Fredoka',sans-serif;font-size:40px;font-weight:600;color:var(--purple-dark);line-height:1}
.rec-box.prep .rec-time{color:#C2410C}
.rec-dot{width:16px;height:16px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#leaveModal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:20px}
#leaveModal .lm-back{position:absolute;inset:0;background:rgba(45,45,63,.55);backdrop-filter:blur(3px)}
#leaveModal .lm-box{position:relative;background:#fff;border-radius:var(--radius-lg);padding:32px 30px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)}

.btn{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;border:none;
  border-radius:999px;padding:14px 32px;font-weight:800;font-size:15.5px;box-shadow:var(--shadow)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-green{background:linear-gradient(135deg,var(--green),#16A34A)}
.btn-ghost{background:none;color:var(--gray);border:2px solid var(--cream-dark);box-shadow:none}

.note{border-radius:var(--radius);padding:14px 18px;font-size:14.5px;margin-top:14px}
.note.ok{background:var(--green-light);color:#15803D}
.note.warn{background:var(--yellow-light);color:#B45309}
.note.err{background:var(--red-light);color:#B91C1C}
.note.info{background:var(--purple-light);color:var(--purple-dark)}

.cert{background:linear-gradient(135deg,#FFF8E7,#FFE8D6);border:2px solid var(--orange);
  border-radius:var(--radius-lg);padding:26px;text-align:center;margin-bottom:20px}
.cert .big{font-size:46px}
.loading{text-align:center;color:var(--gray);padding:50px}
</style>
</head>
<body>

<header class="header">
  <div class="wrap">
    <a class="logo" href="#" onclick="go('');return false">🦉 WowSpeak Learn</a>
    <div class="me" id="me"></div>
  </div>
</header>

<div class="wrap">

  <!-- Вход -->
  <div id="login">
    <div class="card">
      <h1 style="font-size:24px;margin-bottom:8px">Обучение WowSpeak</h1>
      <p style="color:var(--gray);font-size:15px;margin-bottom:20px">Войдите тем же логином, что и на платформе.</p>
      <input type="email" id="email" placeholder="E-mail">
      <input type="password" id="pass" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADz1mfQKn0ofqzfs" data-callback="onCaptcha" style="margin:0 0 12px;display:flex;justify-content:center"></div>
      <button class="go" onclick="doLogin()">Войти</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- Каталог -->
  <div id="catalog">
    <h1 style="font-size:clamp(26px,4vw,34px);margin-bottom:6px">Мои курсы</h1>
    <p style="color:var(--gray);margin-bottom:26px">Обучение, тренинги и материалы для преподавателей WowSpeak</p>
    <div class="course-grid" id="courseGrid"><div class="loading">Загружаю курсы…</div></div>
  </div>

  <!-- Курс -->
  <div id="course">
    <a class="back" href="#" onclick="go('');return false">← Все курсы</a>
    <div id="courseBody"></div>
  </div>

  <!-- Урок -->
  <div id="lesson">
    <a class="back" href="#" onclick="go('course/'+currentCourse);return false">← К курсу</a>
    <div id="lessonBody"></div>
  </div>

</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://api.wowteach.ru';
const SUPABASE_KEY = 'sb_publishable_nZIl9kzPNhkd9Gbsm7aAgA_cAeY1s4x';
// общий cookie на .wowteach.ru — вход подхватывается из app / job
const cookieStore = {
  getItem: k => { const m = document.cookie.match(new RegExp('(?:^|; )' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '=([^;]+)')); return m ? decodeURIComponent(m[1]) : null; },
  setItem: (k,v) => { document.cookie = `${k}=${encodeURIComponent(v)}; domain=.wowteach.ru; path=/; max-age=31536000; secure; samesite=lax`; },
  removeItem: k => { document.cookie = `${k}=; domain=.wowteach.ru; path=/; max-age=0; secure; samesite=lax`; }
};
const sb = location.hostname.endsWith('.wowteach.ru')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: cookieStore } })
  : window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let captchaToken = null;
function onCaptcha(t){ captchaToken = t; }

let currentCourse = null, currentCourseData = null;
let edFiles = {};   // { blockId: [ {file, path, name, size, type, uploaded} ] }

// ============ Вход ============
document.addEventListener('DOMContentLoaded', init);
let sessionReady = false;
let dirty = false;   // есть несохранённые изменения на экране пробника/задания

// защита от случайного закрытия вкладки / перезагрузки
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});
// пометка «есть изменения» — вешаем на ввод в полях
function markDirty(){ dirty = true; }
function clearDirty(){ dirty = false; }

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('login'); return; }
  sessionReady = true;
  document.getElementById('me').innerHTML =
    `${esc(session.user.email)} · <button onclick="logout()">Выйти</button>`;
  route();                          // открыть экран из текущего хеша
}

// ===== Хеш-роутинг =====
window.addEventListener('hashchange', route);
let pendingHash = null;
function route(){
  if (!sessionReady) return;
  // если уходим с урока с несохранёнными изменениями — спросить
  if (dirty && document.getElementById('lesson').style.display === 'block') {
    pendingHash = location.hash;
    // временно вернём прежний хеш, покажем модалку
    history.pushState(null, '', pendingHash);
    showLeaveConfirm();
    return;
  }
  applyRoute();
}
function applyRoute(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'course' && parts[1]) { openCourse(parts[1], true); return; }
  if (parts[0] === 'lesson' && parts[1] && parts[2]) { openLessonRoute(parts[1], parts[2]); return; }
  showCatalog(true);
}
function go(hash){ location.hash = hash; }

function showLeaveConfirm(){
  let m = document.getElementById('leaveModal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'leaveModal';
    m.innerHTML = `<div class="lm-back"></div>
      <div class="lm-box">
        <div style="font-size:40px">⚠️</div>
        <h2 style="font-size:20px;margin:8px 0">Выйти без отправки?</h2>
        <p style="color:var(--gray);font-size:14.5px;margin-bottom:20px">
          У вас есть заполненные, но <b>не отправленные</b> ответы. Если выйти сейчас, они не сохранятся.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-ghost" onclick="cancelLeave()">Остаться</button>
          <button class="btn" style="background:var(--red)" onclick="confirmLeave()">Выйти без сохранения</button>
        </div>
      </div>`;
    document.body.appendChild(m);
  }
  m.style.display = 'flex';
}
function cancelLeave(){
  document.getElementById('leaveModal').style.display = 'none';
  pendingHash = null;
}
function confirmLeave(){
  document.getElementById('leaveModal').style.display = 'none';
  clearDirty();
  if (pendingHash != null) { location.hash = pendingHash; pendingHash = null; }
  applyRoute();
}

function show(id, noScroll){
  ['login','catalog','course','lesson'].forEach(k =>
    document.getElementById(k).style.display = k === id ? 'block' : 'none');
  if (!noScroll) window.scrollTo({ top: 0 });
}
async function doLogin(){
  const msg = document.getElementById('loginMsg');
  msg.style.display = 'none';
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim().toLowerCase(),
    password: document.getElementById('pass').value,
    options: { captchaToken }
  });
  if (error) {
    msg.textContent = 'Не получилось войти: проверьте логин и пароль.';
    msg.style.display = 'block';
    if (window.turnstile) { turnstile.reset(); captchaToken = null; }
    return;
  }
  init();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

// ============ Каталог ============
async function showCatalog(fromRoute){
  if (!fromRoute) { go(''); return; }
  show('catalog');
  const { data, error } = await sb.rpc('learn_my_courses');
  const grid = document.getElementById('courseGrid');
  if (error) { grid.innerHTML = 'Ошибка: ' + esc(error.message); return; }
  if (!data.length) { grid.innerHTML = '<div class="loading">Курсов пока нет 🦉</div>'; return; }
  grid.innerHTML = data.map(c => {
    const pct = c.total_lessons ? Math.round(c.done_lessons * 100 / c.total_lessons) : 0;
    return `<div class="course" onclick="go('course/${c.slug}')">
      <div class="emo">${c.emoji || '📚'}</div>
      <h3>${esc(c.title)}</h3>
      <div class="sub">${esc(c.subtitle || '')}</div>
      ${c.enrolled ? `<div class="bar"><i style="width:${pct}%"></i></div>
        <div class="meta"><span>${c.done_lessons} из ${c.total_lessons} уроков</span>
        ${c.completed_at ? '<span class="badge-done">✓ пройден</span>' : `<span>${pct}%</span>`}</div>`
        : `<div class="meta"><span>${c.total_lessons} уроков</span><span style="color:var(--purple)">Начать →</span></div>`}
    </div>`;
  }).join('');
}

// ============ Курс ============
async function openCourse(slug, fromRoute){
  if (!fromRoute) { go('course/'+slug); return; }
  currentCourse = slug;
  show('course');
  const body = document.getElementById('courseBody');
  body.innerHTML = '<div class="loading">Загружаю курс…</div>';

  // запись на курс при первом открытии
  await sb.rpc('learn_enroll', { p_course_slug: slug });

  const { data, error } = await sb.rpc('learn_course_view', { p_course_slug: slug });
  if (error) { body.innerHTML = 'Ошибка: ' + esc(error.message); return; }
  currentCourseData = data;

  const done = (data.lessons||[]).filter(l => l.done_at).length;
  const total = (data.lessons||[]).length;

  body.innerHTML = `
    <div class="course-head">
      <div class="emo">${data.emoji || '📚'}</div>
      <div>
        <h1>${esc(data.title)}</h1>
        <div class="sub">${esc(data.subtitle || '')}</div>
      </div>
    </div>

    ${data.certificate ? `<div class="cert">
      <div class="big">🏆</div>
      <h2 style="font-size:20px;margin:6px 0">Курс пройден!</h2>
      <div style="font-size:14px;color:var(--gray)">Сертификат № <b>${esc(data.certificate)}</b></div>
    </div>` : ''}

    ${data.description ? `<div class="card" style="padding:20px 24px">${data.description}</div>` : ''}

    <div class="bar" style="height:10px;margin-bottom:8px"><i style="width:${total?done*100/total:0}%"></i></div>
    <div style="font-size:13px;color:var(--gray);font-weight:700;margin-bottom:20px">
      ${done} из ${total} уроков пройдено
      ${data.deadline_at && !data.completed_at ? ` · до ${new Date(data.deadline_at).toLocaleDateString('ru-RU')}` : ''}
    </div>

    ${(data.lessons||[]).map((l, i) => `
      <div class="lesson-item ${l.done_at?'done':''} ${l.locked?'locked':''}"
           onclick="${l.locked ? '' : `go('lesson/${currentCourse}/${l.slug}')`}">
        <div class="n">${l.done_at ? '✓' : (l.locked ? '🔒' : i+1)}</div>
        <div class="t"><b>${esc(l.title)}</b>
          <span>${esc(l.summary || '')}${l.score != null ? ` · результат ${l.score}%` : ''}</span></div>
        ${l.locked ? '<span style="font-size:12px;color:var(--gray)">пройдите предыдущий</span>' : '<span style="color:var(--purple);font-weight:800">→</span>'}
      </div>`).join('')}
  `;
}

let currentLesson = null;
// открыть урок из роутера: сначала грузим курс, если он ещё не загружен
async function openLessonRoute(courseSlug, lessonSlug){
  if (currentCourse !== courseSlug || !currentCourseData) {
    currentCourse = courseSlug;
    await sb.rpc('learn_enroll', { p_course_slug: courseSlug });
    const { data } = await sb.rpc('learn_course_view', { p_course_slug: courseSlug });
    currentCourseData = data;
  }
  renderLesson(lessonSlug);
}

function openLesson(slug){
  // клик по уроку — меняем хеш, роутер отрисует
  go('lesson/' + currentCourse + '/' + slug);
}

function renderLesson(slug, keepScroll){
  clearDirty();
  const l = (currentCourseData?.lessons||[]).find(x => x.slug === slug);
  if (!l) { go('course/' + currentCourse); return; }
  if (l.locked) { go('course/' + currentCourse); return; }
  currentLesson = l;
  show('lesson', keepScroll);
  const body = document.getElementById('lessonBody');
  body.innerHTML = `
    <h1 style="font-size:clamp(22px,3.5vw,28px);margin-bottom:6px">${esc(l.title)}</h1>
    <div style="color:var(--gray);margin-bottom:26px">${esc(l.summary || '')}</div>
    ${(l.blocks||[]).map(b => renderBlock(b)).join('')}
    <div style="text-align:center;margin-top:34px" id="finishBox">
      ${l.done_at
        ? '<div class="note ok">✅ Урок пройден</div>'
        : `<button class="btn btn-green" onclick="finishLesson()">Завершить урок ✓</button>`}
    </div>`;
  // любое редактирование в уроке помечает «есть несохранённое»
  body.addEventListener('input', markDirty);
  body.addEventListener('change', markDirty);
}

function renderBlock(b){
  const p = b.payload || {};
  if (b.type === 'video') {
    let embed = '';
    if (p.provider === 'youtube') {
      const id = (p.url||'').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/)?.[1] || '';
      embed = `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`;
    } else if (p.provider === 'vimeo') {
      const id = (p.url||'').match(/vimeo\.com\/(\d+)/)?.[1] || '';
      embed = `<iframe src="https://player.vimeo.com/video/${id}" allowfullscreen></iframe>`;
    } else {
      embed = `<video controls src="${esc(p.url||'')}"></video>`;
    }
    return `<div class="block block-video">
      ${p.title ? `<h3 style="font-size:17px;margin-bottom:10px">🎬 ${esc(p.title)}</h3>` : ''}
      ${embed}</div>`;
  }
  if (b.type === 'text') {
    return `<div class="block block-text card">${p.html || ''}</div>`;
  }
  if (b.type === 'task') {
    const s = b.submission;
    const ans = s?.answers || {};
    const savedHtml = ans.html || ans.text || '';   // text — совместимость со старым форматом
    const files = ans.files || [];
    // восстанавливаем уже загруженные файлы в состояние редактора
    edFiles[b.id] = files.map(f => ({ ...f, uploaded: true }));
    const locked = s?.review_status === 'pending' || s?.review_status === 'approved';
    return `<div class="block"><div class="qbox">
      <h3>✍️ Задание</h3>
      <div class="block-text" style="margin-bottom:16px">${p.html || ''}</div>

      <div class="editor ${locked?'locked':''}" id="ed-wrap-${b.id}">
        <div class="toolbar">
          <button type="button" onclick="fmt('bold')" title="Жирный"><b>Ж</b></button>
          <button type="button" onclick="fmt('italic')" title="Курсив"><i>К</i></button>
          <button type="button" onclick="fmt('insertUnorderedList')" title="Список">•—</button>
          <button type="button" onclick="fmt('insertOrderedList')" title="Нумерованный">1.</button>
          <button type="button" onclick="fmtBlock('H3')" title="Заголовок">H</button>
          <button type="button" onclick="fmtBlock('BLOCKQUOTE')" title="Цитата">❝</button>
        </div>
        <div class="ed" id="task-${b.id}" contenteditable="${locked?'false':'true'}"
             data-ph="Напишите ваш ответ…" oninput="edCount('${b.id}')">${savedHtml}</div>
      </div>

      <div class="files" id="files-${b.id}">
        ${files.map((f,i) => fileChip(f, b.id, i, locked)).join('')}
      </div>
      ${locked ? '' : `<label class="drop" id="drop-${b.id}">
        <input type="file" id="file-${b.id}" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.doc,.docx,.ppt,.pptx,.txt,.mp4,.mov,.webm" onchange="pickFiles('${b.id}')" style="display:none">
        <span>📎 Прикрепить файлы</span>
        <span class="hint">PDF, картинки, Word, PowerPoint, видео до 5 мин · до 3 файлов, 50 МБ</span>
      </label>`}

      ${s?.review_status === 'pending' ? '<div class="note warn">⏳ Отправлено методисту на проверку</div>' : ''}
      ${s?.review_status === 'approved' ? `<div class="note ok">✅ Принято методистом${s.note ? ': ' + esc(s.note) : ''}</div>` : ''}
      ${s?.review_status === 'rejected' ? `<div class="note err">✏️ Нужно доработать${s.note ? ': ' + esc(s.note) : ''}</div>` : ''}

      ${locked && s?.review_status !== 'rejected' ? '' :
        `<div style="margin-top:16px"><button class="btn" id="taskBtn-${b.id}" onclick="submitTask('${b.id}')">Отправить на проверку</button></div>`}
    </div></div>`;
  }
  if (b.type === 'exam') return renderExam(b);

    const s = b.submission;
    const ans = s?.answers || {};
    const res = s?.results || null;

    const pass = currentCourseData?.pass_score ?? 80;
    const ok = s?.auto_score != null && s.auto_score >= pass;
    return `<div class="block"><div class="qbox" id="exin-${b.id}">
      <h3>⌨️ ${esc(p.title || 'Задания с вводом ответа')}</h3>
      ${p.note ? `<div style="font-size:13px;color:var(--gray);margin-bottom:16px">${esc(p.note)}</div>` : ''}
      ${(p.items||[]).map((it, ii) => {
        const mark = res ? res[ii] : undefined;
        const badge = mark === false
          ? '<span style="font-size:12px;font-weight:800;color:var(--red);background:var(--red-light);border-radius:999px;padding:2px 10px;margin-left:8px">неверно</span>'
          : mark === true
          ? '<span style="font-size:12px;font-weight:800;color:#15803D;background:var(--green-light);border-radius:999px;padding:2px 10px;margin-left:8px">верно</span>' : '';
        return `<div class="q" data-ii="${ii}" style="${mark===false?'border-left:3px solid var(--red);padding-left:12px':''}">
          <div class="qt">${it.n != null ? it.n + '. ' : ''}${esc(it.prompt||'')}${badge}</div>
          <input type="text" class="exin-field" data-ii="${ii}"
            value="${esc(ans[ii] != null ? (Array.isArray(ans[ii]) ? ans[ii][0] : ans[ii]) : '')}"
            placeholder="${it.kind === 'sequence' ? 'например: 632174' : 'ваш ответ'}"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            style="width:100%;padding:11px 14px;border:2px solid var(--cream-dark);border-radius:10px;font-size:15px;background:#FDFCF8;margin-top:6px;font-weight:700">
        </div>`;
      }).join('')}
      ${s?.auto_score != null ? `<div class="note ${ok?'ok':'warn'}">Результат: <b>${s.auto_score}%</b>${wrong>0?` · ошибок: ${wrong} — исправьте отмеченные и проверьте снова`:' ✅'}</div>` : ''}
      <div style="margin-top:16px"><button class="btn" onclick="submitExact('${b.id}')">${s?'Проверить ещё раз':'Проверить'}</button></div>
    </div></div>`;
  }
  if (b.type === 'quiz') {
    const s = b.submission;
    const answered = s?.answers != null;
    const res = s?.results || null;              // {"0":true,"1":false} — только верно/неверно
    const wrong = res ? Object.values(res).filter(v => v === false).length : 0;
    const pass = currentCourseData?.pass_score ?? 80;
    const ok = s?.auto_score != null && s.auto_score >= pass;

    return `<div class="block"><div class="qbox" id="quiz-${b.id}">
      <h3>📝 Тест</h3>
      ${(p.questions||[]).map((q, qi) => {
        const mark = res ? res[qi] : undefined;   // true | false | undefined (текстовый)
        const badge = mark === false
          ? '<span style="font-size:12px;font-weight:800;color:var(--red);background:var(--red-light);border-radius:999px;padding:2px 10px;margin-left:8px">неверно</span>'
          : mark === true
          ? '<span style="font-size:12px;font-weight:800;color:#15803D;background:var(--green-light);border-radius:999px;padding:2px 10px;margin-left:8px">верно</span>'
          : '';
        return `
        <div class="q" data-qi="${qi}" style="${mark === false ? 'border-left:3px solid var(--red);padding-left:12px' : ''}">
          <div class="qt">${qi+1}. ${esc(q.q)}${badge}</div>
          ${q.type === 'text'
            ? `<textarea data-a="${qi}" placeholder="Ваш ответ…">${esc(answered ? (s.answers[qi]?.[0] ?? '') : '')}</textarea>`
            : (q.options||[]).map((o, oi) => `
                <label class="opt">
                  <input type="${q.type==='multi'?'checkbox':'radio'}" name="q-${b.id}-${qi}" value="${oi}"
                    ${answered && (s.answers[qi]||[]).includes(oi) ? 'checked' : ''}>
                  <span>${esc(o)}</span>
                </label>`).join('')}
        </div>`;
      }).join('')}

      ${s?.auto_score != null ? `<div class="note ${ok ? 'ok' : 'warn'}">
        Результат: <b>${s.auto_score}%</b> ${ok ? '— тест пройден ✅' : `— нужно минимум ${pass}%`}
        ${wrong > 0 ? `<br>Ошибок: <b>${wrong}</b>. Вопросы с ошибками отмечены — подумайте ещё раз и ответьте заново.` : ''}
      </div>` : ''}
      ${s?.review_status === 'pending' ? '<div class="note warn">⏳ Развёрнутые ответы отправлены методисту на проверку</div>' : ''}

      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" onclick="submitQuiz('${b.id}')">${answered ? 'Проверить ещё раз' : 'Проверить'}</button>
        ${wrong > 0 ? `<button class="btn btn-ghost" onclick="clearWrong('${b.id}')">Очистить неверные</button>` : ''}
      </div>
    </div></div>`;
  }
  return '';
}

// снять отметки с неверно отвеченных вопросов, чтобы ответить заново
function clearWrong(blockId){
  const box = document.getElementById('quiz-' + blockId);
  const block = (currentLesson.blocks||[]).find(x => x.id === blockId);
  const res = block?.submission?.results || {};
  box.querySelectorAll('.q').forEach(qEl => {
    const qi = qEl.dataset.qi;
    if (res[qi] === false) {
      qEl.querySelectorAll('input').forEach(i => i.checked = false);
      qEl.style.borderLeft = '3px solid var(--purple)';
    }
  });
}

// ===== Аудирование: плеер без перемотки, один раз =====
function mediaUrl(path){
  const { data } = sb.storage.from('learn-media').getPublicUrl(path);
  return data.publicUrl;
}

async function playListening(blockId, src){
  const wrap = document.getElementById('audio-wrap-' + blockId);
  const audio = new Audio(src);
  audio.preload = 'auto';

  wrap.innerHTML = `
    <div class="rec-box" style="border-color:var(--purple)">
      <div style="font-weight:800;font-size:15px">🎧 Идёт аудирование</div>
      <div class="rec-time" id="audio-time-${blockId}">0:00</div>
      <div style="font-size:13px;color:var(--gray)">Перемотка и пауза недоступны. Не закрывайте страницу.</div>
    </div>`;

  // запрет перемотки: любой seek возвращаем назад
  let lastTime = 0;
  audio.addEventListener('timeupdate', () => {
    if (audio.currentTime > lastTime + 0.5) { audio.currentTime = lastTime; }
    else lastTime = audio.currentTime;
    const el = document.getElementById('audio-time-' + blockId);
    if (el) el.textContent = fmtSec(Math.floor(audio.currentTime));
  });
  audio.addEventListener('seeking', () => {
    if (audio.currentTime > lastTime + 0.5) audio.currentTime = lastTime;
  });
  // запрет паузы (кроме конца)
  audio.addEventListener('pause', () => {
    if (!audio.ended) audio.play().catch(()=>{});
  });

  audio.addEventListener('ended', async () => {
    wrap.innerHTML = '<div class="note ok">🎧 Аудирование завершено. Переходите к ответам ниже.</div>';
    // фиксируем факт прослушивания
    await sb.rpc('learn_submit_exam', {
      p_block_id: blockId, p_section: 'audio', p_kind: 'text',
      p_answers: { played: true }, p_meta: { played_at: new Date().toISOString() }
    }).catch(()=>{});
  });

  try {
    await audio.play();
  } catch(e) {
    wrap.innerHTML = `<div class="note err">Не удалось запустить аудио: ${esc(e.message||e)}<br>Проверьте соединение и обновите страницу.</div>`;
  }
}

// ===== Запись микрофона (устная часть) =====
let mediaStream = null, mediaRec = null, recChunks = [], recTimer = null, prepTimer = null;

function pickMime(){
  const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for (const m of cands) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

async function startSpeaking(blockId, task){
  const stage = document.getElementById(`sp-stage-${blockId}-${task.id}`);
  stage.style.display = 'block';
  const r = stage.getBoundingClientRect();
  if (r.top < 0 || r.bottom > window.innerHeight) stage.scrollIntoView({ behavior:'smooth', block:'center' });

  // запрос микрофона
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    stage.innerHTML = `<div class="note err">Не удалось получить доступ к микрофону. Разрешите доступ в браузере и попробуйте снова.<br>Либо запись можно приложить файлом ниже.</div>`;
    return;
  }
  const mime = pickMime();
  if (!mime) {
    stage.innerHTML = `<div class="note err">Ваш браузер не поддерживает запись. Откройте пробник в Chrome или приложите готовый аудиофайл.</div>`;
    return;
  }

  // режим задания 3: аудио-вопросы играют, микрофон пишет параллельно
  if (task.audio_path) {
    await runAudioParallel(blockId, task, mime, stage);
    return;
  }

  // серия (perItemSec × items) или одиночная (maxDurationSec)
  const isSeries = !!task.perItemSec;
  const items = isSeries ? (task.items || 1) : 1;
  window.__recBlobs = window.__recBlobs || {};
  window.__recBlobs[task.id] = [];

  await runSpeakingStep(blockId, task, mime, 1, items, stage);
}

// Задание 3: непрерывная запись, поверх играет аудио с вопросами
async function runAudioParallel(blockId, task, mime, stage){
  window.__recBlobs = window.__recBlobs || {};
  window.__recBlobs[task.id] = [];

  const src = mediaUrl(task.audio_path);
  const audio = new Audio(src);
  audio.preload = 'auto';

  // подготовка перед стартом (если задана)
  if (task.prepSec > 0) {
    await countdown(stage, task.prepSec, '⏳ Подготовка', 'Задание 3',
      'Сейчас начнётся аудио с вопросами. Отвечайте после каждого — микрофон уже пишет.');
  }

  await new Promise((resolve) => {
    recChunks = [];
    mediaRec = new MediaRecorder(mediaStream, { mimeType: mime });
    mediaRec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = () => {
      window.__recBlobs[task.id].push(new Blob(recChunks, { type: mime }));
      resolve();
    };
    mediaRec.start();

    stage.innerHTML = `
      <div class="rec-box">
        <div class="rec-dot"></div>
        <div style="font-weight:800;font-size:15px">🎧 Интервью идёт — отвечайте на вопросы</div>
        <div class="rec-time" id="rec-time">0:00</div>
        <div style="font-size:13px;color:var(--gray)">Аудио остановится само. Микрофон пишет всё время.</div>
      </div>`;

    let elapsed = 0;
    recTimer = setInterval(() => {
      elapsed++;
      const el = document.getElementById('rec-time');
      if (el) el.textContent = fmtSec(elapsed);
    }, 1000);

    // старт аудио; по окончании — стоп записи
    audio.addEventListener('ended', () => {
      clearInterval(recTimer);
      try { mediaRec.stop(); } catch(_){}
    });
    // запрет перемотки аудио
    let lastT = 0;
    audio.addEventListener('timeupdate', () => {
      if (audio.currentTime > lastT + 0.5) audio.currentTime = lastT; else lastT = audio.currentTime;
    });
    audio.play().catch(() => {
      // если автоплей заблокирован — не страшно, запись идёт, ученик слышит после клика
      clearInterval(recTimer);
      try { mediaRec.stop(); } catch(_){}
    });
  });

  finishSpeaking(blockId, task, mime, stage);
}

function __speakingSeriesEntry(){ /* маркер */ }

async function runSpeakingStep(blockId, task, mime, step, total, stage){
  const isSeries = !!task.perItemSec;
  const dur = isSeries ? task.perItemSec : (task.maxDurationSec || 60);
  const label = total > 1 ? `Ответ ${step} из ${total}` : 'Запись';

  // фаза подготовки (только перед первым шагом; у серий подготовка одна на всё задание)
  const prep = (step === 1) ? (task.prepSec || 0) : 0;

  if (prep > 0) {
    await countdown(stage, prep, '⏳ Подготовка', label,
      'Обдумайте ответ. Запись начнётся автоматически.');
  }

  // фаза записи
  await new Promise((resolve) => {
    recChunks = [];
    mediaRec = new MediaRecorder(mediaStream, { mimeType: mime });
    mediaRec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = () => {
      const blob = new Blob(recChunks, { type: mime });
      window.__recBlobs[task.id].push(blob);
      resolve();
    };
    mediaRec.start();

    let left = dur;
    stage.innerHTML = `
      <div class="rec-box">
        <div class="rec-dot"></div>
        <div style="font-weight:800;font-size:15px">${label} — идёт запись</div>
        <div class="rec-time" id="rec-time">${fmtSec(left)}</div>
        <button class="btn btn-ghost" style="padding:8px 18px" onclick="stopRec()">Стоп</button>
      </div>`;
    window.__stopRec = () => { try{ mediaRec.stop(); }catch(_){} clearInterval(recTimer); };
    recTimer = setInterval(() => {
      left--;
      const el = document.getElementById('rec-time');
      if (el) el.textContent = fmtSec(left);
      if (left <= 0) { clearInterval(recTimer); window.__stopRec(); }
    }, 1000);
  });

  // следующий шаг серии или финал
  if (step < total) {
    await runSpeakingStep(blockId, task, mime, step + 1, total, stage);
  } else {
    finishSpeaking(blockId, task, mime, stage);
  }
}

function stopRec(){ if (window.__stopRec) window.__stopRec(); }

function countdown(stage, sec, title, sub, hint){
  return new Promise(resolve => {
    let left = sec;
    const draw = () => {
      stage.innerHTML = `<div class="rec-box prep">
        <div style="font-weight:800;font-size:15px">${title} · ${sub}</div>
        <div class="rec-time">${fmtSec(left)}</div>
        <div style="font-size:13px;color:var(--gray)">${hint||''}</div>
        <button class="btn" style="padding:8px 18px" onclick="window.__skipPrep&&window.__skipPrep()">Готов, начать сейчас</button>
      </div>`;
    };
    draw();
    window.__skipPrep = () => { clearInterval(prepTimer); resolve(); };
    prepTimer = setInterval(() => {
      left--; 
      if (left <= 0) { clearInterval(prepTimer); resolve(); }
      else draw();
    }, 1000);
  });
}

async function finishSpeaking(blockId, task, mime, stage){
  const blobs = window.__recBlobs[task.id] || [];
  // склеиваем серию в один файл (простая конкатенация контейнеров webm работает для воспроизведения последовательно;
  //  для надёжности грузим каждый ответ отдельным файлом с индексом)
  stage.innerHTML = `<div class="rec-box"><div style="font-weight:800">⬆ Загружаю запись…</div></div>`;
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

  try {
    const { data:{ session } } = await sb.auth.getSession();
    const uid = session.user.id;
    const ext = mime.includes('mp4') ? 'mp4' : mime.includes('ogg') ? 'ogg' : 'webm';
    const paths = [];
    for (let i = 0; i < blobs.length; i++) {
      const path = `${uid}/${blockId}/speaking_${task.id}_${i+1}_${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from('learn-tasks').upload(path, blobs[i], { contentType: mime });
      if (upErr) throw upErr;
      paths.push(path);
    }
    const { error } = await sb.rpc('learn_submit_exam', {
      p_block_id: blockId, p_section: 'speaking_' + task.id, p_kind: 'audio',
      p_answers: {}, p_storage: paths[0], p_mime: mime,
      p_meta: { task: task.id, parts: paths, count: paths.length }
    });
    if (error) throw error;
    stage.innerHTML = `<div class="note ok">✅ Запись отправлена методисту.</div>`;
    setTimeout(refreshLesson, 800);
  } catch(e) {
    stage.innerHTML = `<div class="note err">Не удалось загрузить запись: ${esc(e.message||e)}</div>`;
  }
}

function fmtSec(s){ s = Math.max(0, s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function renderExam(b){
  const p = b.payload || {};
  const st = b.exam_state || {};
  const secs = p.sections || [];
  return `<div class="block">
    <div class="exam-head">
      <h2 style="font-size:22px;margin-bottom:8px">📝 ${esc(p.title || 'Пробник')}</h2>
      ${p.intro_html ? `<div class="block-text">${p.intro_html}</div>` : ''}
      ${p.written_timer_sec ? `<div class="note info" style="margin-top:14px">⏱ Письменная часть: ${Math.round(p.written_timer_sec/60)} минут. Таймер появится на следующем шаге разработки.</div>` : ''}
    </div>
    ${secs.map((sec, si) => {
      const div = sec.divider ? `<div class="exam-divider"><span>${esc(sec.divider)}</span></div>` : '';
      return div + renderSection(b.id, sec, si, st);
    }).join('')}
  </div>`;
}

function renderSection(blockId, sec, si, st){
  const kind = sec.kind;
  if (kind === 'audio') {
    const s = st['audio'];
    const played = s?.answers?.played || (s?.review_status != null);
    const src = sec.url || (sec.path ? mediaUrl(sec.path) : '');
    return sectionWrap('🎧', sec.title || 'Аудирование', sec.note || 'Аудио включается один раз и не перематывается — как на настоящем экзамене. Повторное прослушивание уже встроено в запись.', `
      <div id="audio-wrap-${blockId}" style="text-align:center">
        ${played
          ? '<div class="note info">🎧 Аудирование прослушано. Повторный запуск недоступен.</div>'
          : src
            ? `<button class="btn" id="audio-btn-${blockId}" onclick="playListening('${blockId}','${esc(src)}')">▶ Включить аудирование</button>
               <div style="font-size:12.5px;color:var(--gray);margin-top:10px">Убедитесь, что вы готовы: перемотка и пауза недоступны, запустить можно один раз.</div>`
            : '<div class="note warn">Аудиофайл ещё не загружен организатором.</div>'}
      </div>`);
  }
  if (kind === 'auto_quiz') {
    const s = st['auto_quiz'];
    const res = s?.results || null;
    return sectionWrap('📋', sec.title, sec.note, `
      <div id="exq-${blockId}">
        ${(sec.quiz?.questions||[]).map((q, qi) => renderExamQuestion(blockId, q, qi, res, s)).join('')}
      </div>
      ${s?.auto_score != null ? `<div class="note ${s.auto_score>=80?'ok':'warn'}">Результат: <b>${s.auto_score}%</b></div>` : ''}
      <button class="btn" style="margin-top:14px" onclick="submitExamQuiz('${blockId}')">${s?'Проверить ещё раз':'Проверить'}</button>`);
  }
  if (kind === 'exact_input') {
    const s = st['exact_input'];
    const res = s?.results || null;
    const ans = s?.answers || {};
    return sectionWrap('⌨️', sec.title, sec.note, `
      <div id="exe-${blockId}">
        ${(sec.items||[]).map((it, ii) => {
          const mark = res ? res[ii] : undefined;
          const badge = mark===false?'<span class="bad">неверно</span>':mark===true?'<span class="good">верно</span>':'';
          return `<div class="q" style="${mark===false?'border-left:3px solid var(--red);padding-left:12px':''}">
            <div class="qt">${it.n!=null?it.n+'. ':''}${esc(it.prompt||'')}${badge}</div>
            <input type="text" class="exe-field" data-ii="${ii}" spellcheck="false" autocapitalize="off"
              value="${esc(ans[ii]!=null?(Array.isArray(ans[ii])?ans[ii][0]:ans[ii]):'')}"
              placeholder="${it.kind==='sequence'?'например: 632174':'ваш ответ'}"
              style="width:100%;padding:11px 14px;border:2px solid var(--cream-dark);border-radius:10px;font-size:15px;background:#FDFCF8;margin-top:6px;font-weight:700">
          </div>`;
        }).join('')}
      </div>
      ${s?.auto_score!=null?`<div class="note ${s.auto_score>=80?'ok':'warn'}">Результат: <b>${s.auto_score}%</b></div>`:''}
      <button class="btn" style="margin-top:14px" onclick="submitExamExact('${blockId}')">${s?'Проверить ещё раз':'Проверить'}</button>`);
  }
  if (kind === 'writing') {
    const key = 'writing_' + si;
    const s = st[key];
    const done = s?.review_status;
    const imgs = (sec.images || (sec.image ? [sec.image] : [])).map(p =>
      `<img src="${esc(mediaUrl(p))}" style="max-width:100%;border-radius:12px;margin:10px 0;border:1px solid var(--cream-dark)">`).join('');
    return sectionWrap('✍️', sec.title, null, `
      <div class="block-text">${sec.prompt_html || ''}</div>
      ${imgs}
      ${sec.min_words||sec.max_words?`<div style="font-size:12.5px;color:var(--gray);margin:8px 0">Объём: ${sec.min_words||''}–${sec.max_words||''} слов</div>`:''}
      <div class="wr-tabs">
        <button class="wr-tab on" onclick="wrTab('${blockId}','${key}','typed',this)">⌨️ Напечатать</button>
        <button class="wr-tab" onclick="wrTab('${blockId}','${key}','photo',this)">📷 Фото листа</button>
      </div>
      <div id="wr-typed-${blockId}-${key}">
        <textarea id="wr-ta-${blockId}-${key}" ${sec.no_spellcheck?'spellcheck="false"':''}
          placeholder="Напишите ответ…" style="width:100%;min-height:160px;padding:14px;border:2px solid var(--cream-dark);border-radius:12px;font-size:15px;background:#FDFCF8;resize:vertical">${esc(s?.answers?.text||'')}</textarea>
      </div>
      <div id="wr-photo-${blockId}-${key}" style="display:none">
        <label class="drop"><input type="file" accept="image/*,.pdf" onchange="wrPhoto('${blockId}','${key}',this)" style="display:none">
          <span>📷 Загрузить фото рукописного листа</span><span class="hint">JPG, PNG или PDF</span></label>
        <div id="wr-files-${blockId}-${key}" class="files"></div>
      </div>
      ${done==='pending'?'<div class="note warn">⏳ Отправлено методисту</div>':''}
      ${done==='approved'?`<div class="note ok">✅ Принято${s.note?': '+esc(s.note):''}</div>`:''}
      ${done==='rejected'?`<div class="note err">✏️ Доработать${s.note?': '+esc(s.note):''}</div>`:''}
      <button class="btn" style="margin-top:14px" onclick="submitWriting('${blockId}','${key}')">Отправить на проверку</button>`);
  }
  if (kind === 'speaking') {
    const st2 = st;
    return sectionWrap('🎤', sec.title, sec.note, `
      <div style="display:flex;flex-direction:column;gap:14px">
        ${(sec.tasks||[]).map((t, ti) => {
          const key = 'speaking_' + t.id;
          const s = st2[key];
          const done = s?.review_status || (s?.has_file ? 'pending' : null);
          const imgs = (t.images || (t.image ? [t.image] : [])).map(pth =>
            `<img src="${esc(mediaUrl(pth))}" style="max-width:100%;border-radius:10px;margin:8px 0;border:1px solid var(--cream-dark)">`).join('');
          const modeHint = t.audio_path ? '🎧 Аудио + запись одновременно'
            : t.perItemSec ? `${t.items} ответов по ${t.perItemSec}с`
            : `запись до ${t.maxDurationSec}с`;
          return `<div class="sp-task" id="sp-${blockId}-${t.id}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
              <div style="flex:1;min-width:200px">
                <b style="font-size:15px">${esc(t.label)}</b>
                <div style="font-size:12.5px;color:var(--gray);margin-top:3px">
                  ${t.prepSec?`⏱ подготовка ${t.prepSec}с · `:''}${modeHint}${t.allowReRecord===false?' · без перезаписи':''}
                </div>
              </div>
              ${done==='pending'||done==='approved'
                ? `<span class="sp-done">✅ записано</span>`
                : `<button class="btn" style="padding:10px 20px;font-size:14px"
                     onclick='startSpeaking("${blockId}", ${JSON.stringify(t).replace(/'/g,"&#39;")})'>▶ Начать</button>`}
            </div>
            ${t.prompt_html ? `<div class="block-text" style="margin-top:10px;font-size:14px">${t.prompt_html}</div>` : ''}
            ${imgs}
            ${done==='rejected'?`<div class="note err" style="margin-top:10px">✏️ ${s.note?esc(s.note):'на доработку'}</div>`:''}
            <div class="sp-stage" id="sp-stage-${blockId}-${t.id}" style="display:none"></div>
          </div>`;
        }).join('')}
      </div>`);
  }
  if (kind === 'reflection') {
    const s = st['reflection'];
    return sectionWrap('💭', sec.title, null, `
      <div class="block-text">${sec.prompt_html || ''}</div>
      <textarea id="refl-${blockId}" placeholder="Ваш ответ…" style="width:100%;min-height:120px;padding:14px;border:2px solid var(--cream-dark);border-radius:12px;font-size:15px;background:#FDFCF8;resize:vertical;margin-top:10px">${esc(s?.answers?.text||'')}</textarea>
      ${s?.review_status==='pending'?'<div class="note warn">⏳ Отправлено методисту</div>':''}
      <button class="btn" style="margin-top:14px" onclick="submitReflection('${blockId}')">Отправить</button>`);
  }
  return '';
}

function sectionWrap(icon, title, note, inner){
  return `<div class="qbox" style="margin-bottom:18px">
    <h3>${icon} ${esc(title||'')}</h3>
    ${note?`<div style="font-size:13px;color:var(--gray);margin-bottom:14px">${esc(note)}</div>`:''}
    ${inner}</div>`;
}
function renderExamQuestion(blockId, q, qi, res, s){
  const ans = s?.answers || {};
  const mark = res ? res[qi] : undefined;
  const badge = mark===false?'<span class="bad">неверно</span>':mark===true?'<span class="good">верно</span>':'';
  return `<div class="q" data-qi="${qi}" style="${mark===false?'border-left:3px solid var(--red);padding-left:12px':''}">
    <div class="qt">${esc(q.q)}${badge}</div>
    ${(q.options||[]).map((o,oi)=>`<label class="opt">
      <input type="${q.type==='multi'?'checkbox':'radio'}" name="eq-${blockId}-${qi}" value="${oi}"
        ${(ans[qi]||[]).includes(oi)?'checked':''}><span>${esc(o)}</span></label>`).join('')}
  </div>`;
}

function collectExam(prefix, blockId, selector){
  const box = document.getElementById(prefix + blockId);
  const answers = {};
  box.querySelectorAll('.q').forEach((qEl, idx) => {
    const qi = qEl.dataset.qi ?? idx;
    answers[qi] = [...qEl.querySelectorAll('input:checked')].map(i => parseInt(i.value));
  });
  return answers;
}
async function submitExamQuiz(blockId){
  const answers = collectExam('exq-', blockId);
  const { error } = await sb.rpc('learn_submit_exam',
    { p_block_id: blockId, p_section: 'auto_quiz', p_kind: 'quiz', p_answers: answers });
  if (error) { alert(error.message); return; }
  refreshLesson();
}
async function submitExamExact(blockId){
  const box = document.getElementById('exe-' + blockId);
  const answers = {};
  box.querySelectorAll('.exe-field').forEach(f => answers[f.dataset.ii] = f.value.trim());
  const { error } = await sb.rpc('learn_submit_exam',
    { p_block_id: blockId, p_section: 'exact_input', p_kind: 'exact', p_answers: answers });
  if (error) { alert(error.message); return; }
  refreshLesson();
}
function wrTab(blockId, key, mode, btn){
  btn.parentElement.querySelectorAll('.wr-tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById(`wr-typed-${blockId}-${key}`).style.display = mode==='typed'?'block':'none';
  document.getElementById(`wr-photo-${blockId}-${key}`).style.display = mode==='photo'?'block':'none';
}
let wrPhotoFiles = {};
async function wrPhoto(blockId, key, input){
  const f = input.files[0]; if (!f) return;
  wrPhotoFiles[blockId+key] = f;
  document.getElementById(`wr-files-${blockId}-${key}`).innerHTML =
    `<div class="fchip"><span>📷 ${esc(f.name)}</span></div>`;
}
async function submitWriting(blockId, key){
  const ta = document.getElementById(`wr-ta-${blockId}-${key}`);
  const photo = wrPhotoFiles[blockId+key];
  try {
    if (photo) {
      const { data:{session} } = await sb.auth.getSession();
      const path = `${session.user.id}/${blockId}/${key}_${Date.now()}_${photo.name.replace(/[^\w.\-]+/g,'_')}`;
      const { error: upErr } = await sb.storage.from('learn-tasks').upload(path, photo);
      if (upErr) throw upErr;
      const { error } = await sb.rpc('learn_submit_exam',
        { p_block_id: blockId, p_section: key, p_kind: 'writing', p_answers: {},
          p_storage: path, p_mime: photo.type, p_meta: { via: 'photo' } });
      if (error) throw error;
    } else {
      const text = ta.value.trim();
      if (!text) { alert('Напишите ответ или загрузите фото.'); return; }
      const { error } = await sb.rpc('learn_submit_exam',
        { p_block_id: blockId, p_section: key, p_kind: 'writing',
          p_answers: { text }, p_meta: { via: 'typed', words: text.split(/\s+/).length } });
      if (error) throw error;
    }
    refreshLesson();
  } catch(e){ alert('Не получилось: ' + (e.message||e)); }
}
async function submitReflection(blockId){
  const text = document.getElementById('refl-' + blockId).value.trim();
  if (!text) { alert('Напишите ответ.'); return; }
  const { error } = await sb.rpc('learn_submit_exam',
    { p_block_id: blockId, p_section: 'reflection', p_kind: 'text', p_answers: { text } });
  if (error) { alert(error.message); return; }
  refreshLesson();
}

async function submitExact(blockId){
  const box = document.getElementById('exin-' + blockId);
  const answers = {};
  box.querySelectorAll('.exin-field').forEach(f => {
    answers[f.dataset.ii] = f.value.trim();
  });
  const { data, error } = await sb.rpc('learn_submit_block', { p_block_id: blockId, p_answers: answers });
  if (error) { alert('Не получилось: ' + error.message); return; }
  clearDirty(); await refreshLesson();
}

async function submitQuiz(blockId){
  const box = document.getElementById('quiz-' + blockId);
  const answers = {};
  box.querySelectorAll('.q').forEach(qEl => {
    const qi = qEl.dataset.qi;
    const ta = qEl.querySelector('textarea');
    if (ta) { answers[qi] = [ta.value]; return; }
    answers[qi] = [...qEl.querySelectorAll('input:checked')].map(i => parseInt(i.value));
  });
  const { data, error } = await sb.rpc('learn_submit_block', { p_block_id: blockId, p_answers: answers });
  if (error) { alert('Не получилось: ' + error.message); return; }
  clearDirty(); await refreshLesson();
}

// ===== Редактор заданий =====
function fmt(cmd){ document.execCommand(cmd, false, null); }
function fmtBlock(tag){
  document.execCommand('formatBlock', false, tag);
}
function edCount(blockId){ /* задел под счётчик, пока просто hook */ }

function fileChip(f, blockId, idx, locked){
  const kb = f.size ? (f.size > 1048576 ? (f.size/1048576).toFixed(1)+' МБ' : Math.round(f.size/1024)+' КБ') : '';
  const icon = /\.(mp4|mov|webm)$/i.test(f.name) ? '🎬'
             : /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name) ? '🖼️'
             : /\.pdf$/i.test(f.name) ? '📕'
             : /\.(doc|docx)$/i.test(f.name) ? '📘'
             : /\.(ppt|pptx)$/i.test(f.name) ? '📙' : '📄';
  return `<div class="fchip" data-idx="${idx}">
    <span>${icon} ${esc(f.name)}${kb ? ` · ${kb}` : ''}</span>
    ${locked ? '' : `<button type="button" onclick="removeFile('${blockId}',${idx})" title="Удалить">✕</button>`}
  </div>`;
}

async function pickFiles(blockId){
  const input = document.getElementById('file-' + blockId);
  const picked = [...input.files];
  input.value = '';
  edFiles[blockId] = edFiles[blockId] || [];

  for (const file of picked) {
    if (edFiles[blockId].length >= 3) { alert('Можно прикрепить не более 3 файлов.'); break; }
    if (file.size > 52428800) { alert(`«${file.name}» больше 50 МБ. Видео длиннее 5 минут прикрепите ссылкой в тексте.`); continue; }
    edFiles[blockId].push({ file, name: file.name, size: file.size, type: file.type, uploaded: false });
  }
  redrawFiles(blockId);
}

function removeFile(blockId, idx){
  edFiles[blockId]?.splice(idx, 1);
  redrawFiles(blockId);
}

function redrawFiles(blockId){
  const box = document.getElementById('files-' + blockId);
  box.innerHTML = (edFiles[blockId] || []).map((f, i) => fileChip(f, blockId, i, false)).join('');
}

async function submitTask(blockId){
  const ed = document.getElementById('task-' + blockId);
  const html = ed.innerHTML.trim();
  const list = edFiles[blockId] || [];
  if ((!html || html === '<br>') && !list.length) { alert('Напишите ответ или прикрепите файл.'); return; }

  const btn = document.getElementById('taskBtn-' + blockId);
  if (btn) { btn.disabled = true; btn.textContent = 'Отправляю…'; }

  try {
    const { data: { session } } = await sb.auth.getSession();
    const uid = session.user.id;
    const files = [];
    for (const f of list) {
      if (f.uploaded && f.path) { files.push({ path: f.path, name: f.name, size: f.size, type: f.type }); continue; }
      const safe = f.name.replace(/[^\w.\-]+/g, '_');
      const path = `${uid}/${blockId}/${Date.now()}_${safe}`;
      const { error: upErr } = await sb.storage.from('learn-tasks').upload(path, f.file, { upsert: false });
      if (upErr) throw upErr;
      f.uploaded = true; f.path = path;
      files.push({ path, name: f.name, size: f.size, type: f.type });
    }

    const { error } = await sb.rpc('learn_submit_block',
      { p_block_id: blockId, p_answers: { html, files } });
    if (error) throw error;
    clearDirty(); await refreshLesson();
  } catch (e) {
    alert('Не получилось отправить: ' + (e.message || e));
    if (btn) { btn.disabled = false; btn.textContent = 'Отправить на проверку'; }
  }
}

async function finishLesson(){
  const { data, error } = await sb.rpc('learn_complete_lesson',
    { p_course_slug: currentCourse, p_lesson_slug: currentLesson.slug });
  if (error) { alert('Не получилось: ' + error.message); return; }
  if (!data.ok) {
    document.getElementById('finishBox').innerHTML =
      `<div class="note warn">${esc(data.reason)}</div>
       <div style="margin-top:12px"><button class="btn btn-green" onclick="finishLesson()">Проверить ещё раз</button></div>`;
    return;
  }
  if (data.course_done) {
    alert('🎉 Курс пройден!');
  }
  await openCourse(currentCourse);
}

async function refreshLesson(){
  const scrollY = window.scrollY;   // запомнить позицию
  const { data } = await sb.rpc('learn_course_view', { p_course_slug: currentCourse });
  currentCourseData = data;
  const l = (data.lessons||[]).find(x => x.slug === currentLesson.slug);
  if (l) { currentLesson = l; renderLesson(l.slug, true); }   // true = не скроллить наверх
  window.scrollTo({ top: scrollY });                          // вернуть позицию
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
