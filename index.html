<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7B61FF">
<title>WowSpeak Learn 🦉</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B61FF; --purple-dark:#5A45D9; --purple-light:#F0ECFF;
  --orange:#FF8C42; --orange-light:#FFE8D6;
  --pink:#E91E8C; --green:#22C55E; --green-light:#DCFCE7;
  --red:#EF4444; --red-light:#FEE2E2; --yellow:#F59E0B; --yellow-light:#FEF3C7;
  --cream:#FFFBF2; --cream-dark:#F5EFE2;
  --dark:#2D2D3F; --gray:#5A5A6E; --white:#fff;
  --radius:14px; --radius-lg:22px;
  --shadow-sm:0 1px 3px rgba(45,45,63,.06); --shadow:0 8px 28px rgba(45,45,63,.12);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:inherit}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--dark);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle, rgba(123,97,255,.05) 1px, transparent 1px);background-size:26px 26px}
h1,h2,h3{font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.25}
a{color:var(--purple);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}

.header{position:sticky;top:0;z-index:40;background:rgba(255,251,242,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--cream-dark)}
.mainnav{position:sticky;top:57px;z-index:39;background:rgba(255,251,242,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--cream-dark)}
.mainnav .wrap{display:flex;gap:4px;overflow-x:auto;padding:8px 24px}
.navtab{white-space:nowrap;padding:9px 16px;border-radius:10px;font-size:14px;font-weight:700;color:var(--gray);text-decoration:none;transition:all .15s}
.navtab:hover{background:var(--cream-dark)}
.navtab.on{background:var(--purple-light);color:var(--purple-dark)}
.header .wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.logo{font-family:'Fredoka',sans-serif;font-size:22px;color:var(--purple);font-weight:600}
.header .me{font-size:13px;color:var(--gray)}
.header .me button{background:none;border:none;color:var(--purple);font-weight:800;font-size:13px}

.card{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--radius-lg);
  padding:28px 30px;box-shadow:var(--shadow-sm);margin-bottom:20px}

/* login */
#login{display:none;max-width:420px;margin:80px auto;text-align:center}
#login input{width:100%;padding:13px 14px;border:2px solid var(--cream-dark);border-radius:var(--radius);
  font-size:16px;background:#FDFCF8;margin-bottom:12px}
#login button.go{width:100%;padding:14px;border:none;border-radius:999px;font-weight:800;font-size:16px;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff}
#login .msg{margin-top:12px;font-size:14px;font-weight:700;color:var(--red);display:none}

/* каталог */
#catalog{display:none;padding:34px 0 80px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.course{background:#fff;border:1px solid var(--cream-dark);border-radius:var(--radius-lg);padding:24px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.course:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.course .emo{font-size:40px;margin-bottom:10px}
.course h3{font-size:19px;margin-bottom:5px}
.course .sub{font-size:13.5px;color:var(--gray);flex:1;margin-bottom:14px}
.bar{height:8px;background:var(--cream-dark);border-radius:999px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--pink))}
.course .meta{font-size:12px;color:var(--gray);font-weight:700;display:flex;justify-content:space-between}
.badge-done{background:var(--green-light);color:#15803D;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px}

/* курс */
#course{display:none;padding:30px 0 80px}
.back{font-size:13.5px;font-weight:800;color:var(--gray);display:inline-block;margin-bottom:16px}
.course-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}
.course-head .emo{font-size:52px}
.course-head h1{font-size:clamp(24px,4vw,32px)}
.course-head .sub{color:var(--gray);font-size:16px;margin-top:4px}

.lesson-item{background:#fff;border:2px solid var(--cream-dark);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .15s}
.lesson-item:hover{border-color:var(--purple)}
.lesson-item.locked{opacity:.55;cursor:not-allowed;background:#FAF8F3}
.lesson-item.locked:hover{border-color:var(--cream-dark)}
.lesson-item.done{border-color:var(--green);background:var(--green-light)}
.lesson-item.pending{border-color:#F59E0B;background:#FEF6E7}
.lesson-item.pending .n{background:#F59E0B;color:#fff}
.lesson-chip-pending{font-size:11.5px;font-weight:800;color:#B45309;background:#FDE8C8;border-radius:999px;padding:4px 11px;white-space:nowrap}
.lesson-item .n{width:32px;height:32px;border-radius:50%;background:var(--cream-dark);color:var(--gray);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.lesson-item.done .n{background:var(--green);color:#fff}
.lesson-item .t{flex:1}
.lesson-item .t b{font-size:15.5px;display:block}
.lesson-item .t span{font-size:13px;color:var(--gray)}

/* урок */
#lesson{display:none;padding:30px 0 80px}
.block{margin-bottom:26px}
.block-video iframe,.block-video video{width:100%;aspect-ratio:16/9;border:none;border-radius:var(--radius);background:#000}
.block-text{font-size:16px;line-height:1.75}
.block-text h3{margin:18px 0 8px}
.block-text ul,.block-text ol{margin:10px 0 10px 22px}
.block-text p{margin-bottom:12px}

.qbox{background:#fff;border:2px solid var(--cream-dark);border-radius:var(--radius-lg);padding:24px 26px}
.qbox h3{font-size:18px;margin-bottom:16px}
.q{margin-bottom:22px}
.q .qt{font-weight:800;font-size:15.5px;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:2px solid var(--cream-dark);
  border-radius:12px;margin-bottom:8px;cursor:pointer;background:#FDFCF8;font-size:14.5px}
.opt:hover{border-color:var(--purple)}
.opt input{margin-top:3px;accent-color:var(--purple);width:17px;height:17px}
.opt.correct{border-color:var(--green);background:var(--green-light)}
.opt.wrong{border-color:var(--red);background:var(--red-light)}
.q textarea{width:100%;padding:12px 14px;border:2px solid var(--cream-dark);border-radius:12px;
  font-size:15px;background:#FDFCF8;min-height:100px;resize:vertical}
.explain{font-size:13.5px;color:var(--gray);background:var(--cream);border-radius:10px;padding:10px 14px;margin-top:8px}

/* редактор задания */
.editor{border:2px solid var(--cream-dark);border-radius:var(--radius);overflow:hidden;background:#FDFCF8;transition:border-color .15s,box-shadow .15s}
.editor:focus-within{border-color:var(--purple);box-shadow:0 0 0 4px var(--purple-light)}
.editor.locked{opacity:.7;background:#FAF8F3}
.toolbar{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--cream-dark);background:#fff;flex-wrap:wrap}
.toolbar button{width:34px;height:32px;border:none;background:none;border-radius:8px;font-size:14px;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center}
.toolbar button:hover{background:var(--purple-light);color:var(--purple-dark)}
.ed{min-height:120px;max-height:420px;overflow-y:auto;padding:14px 16px;font-size:15px;line-height:1.65;outline:none}
.ed:empty:before{content:attr(data-ph);color:#9A9AA8}
.ed h3{font-size:17px;margin:10px 0 6px}
.ed blockquote{border-left:3px solid var(--purple);margin:8px 0;padding:2px 0 2px 14px;color:var(--gray)}
.ed ul,.ed ol{margin:8px 0 8px 22px}

/* файлы */
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fchip{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700}
.fchip button{background:none;border:none;color:var(--gray);font-size:15px;cursor:pointer;padding:2px 6px;border-radius:6px}
.fchip button:hover{background:var(--red-light);color:var(--red)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:12px;padding:18px;border:2px dashed var(--cream-dark);border-radius:var(--radius);cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--purple);background:var(--purple-light)}
.drop span:first-child{font-weight:800;font-size:14.5px;color:var(--purple-dark)}
.drop .hint{font-size:12px;color:var(--gray);font-weight:600}

/* пробник */
.exam-head{background:#fff;border:2px solid var(--purple);border-radius:var(--radius-lg);padding:22px 26px;margin-bottom:18px}
.exam-divider{display:flex;align-items:center;gap:14px;margin:28px 0 16px}
.exam-divider:before,.exam-divider:after{content:'';flex:1;height:2px;background:var(--cream-dark)}
.exam-divider span{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;color:var(--purple-dark);white-space:nowrap}
.seq-table{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seq-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.seq-head{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--purple-dark);width:48px;text-align:center}
.seq-box{width:48px;height:52px;text-align:center;font-size:22px;font-weight:800;border:2px solid var(--cream-dark);border-radius:10px;background:#FDFCF8;color:var(--dark)}
.seq-box:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px var(--purple-light)}
.kim-table{border-collapse:collapse;margin:12px 0;width:100%;max-width:520px;font-size:14.5px}
.kim-table th,.kim-table td{border:1.5px solid var(--cream-dark);padding:8px 12px;text-align:left}
.kim-table th{background:var(--purple-light);font-weight:800;color:var(--purple-dark)}
.kim-table td:last-child,.kim-table th:last-child{text-align:center;width:90px;font-weight:700}
.exam-timer{position:sticky;top:64px;z-index:30;float:right;background:var(--purple);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;padding:8px 18px;border-radius:999px;box-shadow:var(--shadow);margin-bottom:8px}
.exam-timer.danger{background:var(--red);animation:pulse 1s infinite}
.q .bad{font-size:12px;font-weight:800;color:var(--red);background:var(--red-light);border-radius:999px;padding:2px 10px;margin-left:8px}
.q .good{font-size:12px;font-weight:800;color:#15803D;background:var(--green-light);border-radius:999px;padding:2px 10px;margin-left:8px}
.wr-tabs{display:flex;gap:8px;margin:14px 0 12px}
.wr-tab{border:2px solid var(--cream-dark);background:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:800;color:var(--gray)}
.wr-tab.on{border-color:var(--purple);background:var(--purple-light);color:var(--purple-dark)}
.sp-task{border:2px solid var(--cream-dark);border-radius:var(--radius);padding:16px 18px}
.sp-done{background:var(--green-light);color:#15803D;font-size:12px;font-weight:800;border-radius:999px;padding:6px 14px;white-space:nowrap}
.sp-locked{margin-top:12px;padding:16px 18px;background:#FBF7EE;border:1.5px dashed var(--cream-dark);border-radius:12px;font-size:13.5px;color:var(--gray);text-align:center}
.map-week{margin-bottom:28px}
.map-week-label{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;color:var(--purple-dark);margin-bottom:12px}
.map-events{display:flex;flex-direction:column;gap:10px}
.map-event{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--cream-dark);border-left:4px solid;border-radius:12px;padding:14px 16px}
.map-event-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.map-badge{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;margin-left:6px;white-space:nowrap}
.map-badge.ok{background:var(--green-light);color:#15803D}
.map-badge.bad{background:var(--red-light);color:var(--red)}
.map-badge.wait{background:#FFF0E4;color:#C2410C}
.rev-tabs{display:flex;gap:8px;margin-bottom:20px}
.rev-tab{border:2px solid var(--cream-dark);background:#fff;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:800;color:var(--gray)}
.rev-tab.on{border-color:var(--purple);background:var(--purple-light);color:var(--purple-dark)}
.rev-dot{background:var(--red);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px}
.rev-card{background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.rev-answer{background:#F8F6FF;border-radius:10px;padding:14px 16px;margin-top:12px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.rev-notif{background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rev-notif.unread{border-left:4px solid var(--purple);background:#FBFAFF}
.teach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.teach-card{background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.teach-card:hover{border-color:var(--purple)}
.teach-ava{width:44px;height:44px;border-radius:50%;background:var(--purple-light);color:var(--purple-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.teach-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0}
.teach-toolbar{margin-bottom:18px}
.teach-filters{display:flex;gap:8px;flex-wrap:wrap}
.teach-filter{border:1.5px solid var(--cream-dark);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--gray);cursor:pointer}
.teach-filter.on{border-color:var(--purple);background:var(--purple-light);color:var(--purple-dark)}
.teach-chip{font-size:11.5px;font-weight:700;background:var(--cream);border-radius:999px;padding:3px 10px;color:var(--gray)}
.teach-chip.ok{background:var(--green-light);color:#15803D}
.teach-chip.warn{background:#FFF0E4;color:#C2410C}
.teach-chip.bad{background:var(--red-light);color:var(--red)}
.dos-head{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--cream-dark);border-radius:16px;padding:20px 24px}
.dos-course{background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.dos-hist{background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;overflow:hidden}
.dos-hist-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--cream)}
.dos-hist-row:last-child{border-bottom:none}
.dos-note{background:#FBFAFF;border:1px solid var(--cream-dark);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.journal-form{background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;padding:18px 20px}
.jf-row{display:flex;gap:10px;flex-wrap:wrap}
.jf-input{flex:1;min-width:180px;padding:10px 14px;border:2px solid var(--cream-dark);border-radius:10px;font-size:14px;background:#FDFCF8;font-family:inherit}
.journal-list{display:flex;flex-direction:column;gap:8px}
.journal-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;padding:12px 16px}
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.an-stat{background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;padding:18px 20px}
.an-num{font-family:'Fredoka',sans-serif;font-weight:600;font-size:34px;line-height:1}
.an-label{font-size:12.5px;color:var(--gray);margin-top:6px}
.an-table{background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;overflow:hidden}
.an-thead,.an-trow{display:flex;align-items:center;gap:10px;padding:12px 16px}
.an-thead{background:var(--purple-light);font-weight:800;font-size:12.5px;color:var(--purple-dark)}
.an-trow{border-top:1px solid var(--cream)}
.an-thead>div,.an-trow>div{flex:1;min-width:0}
.prog-card{background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.prog-card.susp{border-color:var(--red-light);background:#FFF7F7}
.prog-over{display:flex;flex-direction:column;gap:8px}
.tp-list{display:flex;flex-direction:column;gap:8px}
.tp-item{background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;overflow:hidden}
.tp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;cursor:pointer}
.tp-head:hover{background:#FBFAFF}
.tp-bar{height:8px;background:var(--cream-dark);border-radius:999px;overflow:hidden}
.tp-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:999px;transition:width .3s}
.tp-caret{color:var(--purple);font-size:13px}
.tp-flag{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--cream);color:var(--gray)}
.tp-flag.ok{background:var(--green-light);color:#15803D}
.tp-flag.bad{background:var(--red-light);color:var(--red)}
.tp-flag.warn{background:#FEF3E2;color:#B45309}
.tp-body{border-top:1px solid var(--cream);padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:#FDFCFA}
.tp-course{background:#fff;border:1px solid var(--cream-dark);border-radius:10px;padding:13px 15px}
.tp-lessons{margin-top:10px;border-top:1px dashed var(--cream-dark);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.tp-lesson{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
.prog-orow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;padding:12px 16px}
.an-funnel{background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;padding:16px 18px}
.fn-bar{margin-bottom:6px}
.fn-seg{color:#fff;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:8px;white-space:nowrap;min-width:fit-content;transition:width .3s}
.an-chart{display:flex;gap:6px;align-items:flex-end;height:160px;background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;padding:16px}
.ch-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.ch-bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.ch-bar{width:40%;min-height:2px;border-radius:4px 4px 0 0;transition:height .3s}
.ch-label{font-size:10px;color:var(--gray);margin-top:6px;white-space:nowrap}
.fw-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--cream-dark);border-radius:14px;padding:18px 22px;margin-bottom:16px}
.fw-total{text-align:center;background:var(--purple-light);border-radius:12px;padding:10px 20px}
.fw-total-num{font-family:'Fredoka',sans-serif;font-weight:600;font-size:28px;color:var(--purple-dark);line-height:1}
.fw-divider{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--purple-dark);margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--cream-dark)}
.fw-sec{background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.fw-section{background:#fff;border:1.5px solid var(--cream-dark);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.fw-q{border-top:1px solid var(--cream);padding:10px 0}
.fw-q:first-of-type{border-top:none}
.fw-answer{background:#FBFAF7;border:1px solid var(--cream-dark);border-radius:10px;padding:14px 16px;font-size:14.5px;line-height:1.65;word-break:break-word}
.fw-answer img{max-width:100%;border-radius:8px}
.fw-answer table{border-collapse:collapse;max-width:100%}
.fw-answer td,.fw-answer th{border:1px solid var(--cream-dark);padding:6px 10px}

<body>

<header class="header">
  <div class="wrap">
    <a class="logo" href="#" onclick="go('');return false">🦉 WowSpeak Learn</a>
    <div class="me" id="me"></div>
  </div>
</header>
<nav class="mainnav" id="mainnav" style="display:none">
  <div class="wrap" id="mainnavTabs"></div>
</nav>

<div class="wrap">

  <!-- Вход -->
  <div id="login">
    <div class="card">
      <h1 style="font-size:24px;margin-bottom:8px">Обучение WowSpeak</h1>
      <p style="color:var(--gray);font-size:15px;margin-bottom:20px">Войдите тем же логином, что и на платформе.</p>
      <input type="email" id="email" placeholder="E-mail">
      <input type="password" id="pass" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADz1mfQKn0ofqzfs" data-callback="onCaptcha" style="margin:0 0 12px;display:flex;justify-content:center"></div>
      <button class="go" onclick="doLogin()">Войти</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- Каталог -->
  <div id="catalog">
    <h1 style="font-size:clamp(26px,4vw,34px);margin-bottom:6px">Мои курсы</h1>
    <p style="color:var(--gray);margin-bottom:26px">Обучение, тренинги и материалы для преподавателей WowSpeak</p>
    <div class="course-grid" id="courseGrid"><div class="loading">Загружаю курсы…</div></div>
  </div>

  <!-- Курс -->
  <div id="course">
    <a class="back" href="#" onclick="go('');return false">← Все курсы</a>
    <div id="courseBody"></div>
  </div>

  <!-- Урок -->
  <div id="lesson">
    <a class="back" href="#" onclick="go('course/'+currentCourse);return false">← К курсу</a>
    <div id="lessonBody"></div>
  </div>

  <!-- Карта курса -->
  <div id="map">
    <a class="back" href="#" onclick="go('course/'+currentCourse);return false">← К курсу</a>
    <div id="mapBody"></div>
  </div>

  <!-- Кабинет методиста -->
  <div id="review">
    <div id="reviewBody"></div>
  </div>

</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://api.wowteach.ru';
const SUPABASE_KEY = 'sb_publishable_nZIl9kzPNhkd9Gbsm7aAgA_cAeY1s4x';
// общий cookie на .wowteach.ru — вход подхватывается из app / job
const cookieStore = {
  getItem: k => { const m = document.cookie.match(new RegExp('(?:^|; )' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '=([^;]+)')); return m ? decodeURIComponent(m[1]) : null; },
  setItem: (k,v) => { document.cookie = `${k}=${encodeURIComponent(v)}; domain=.wowteach.ru; path=/; max-age=31536000; secure; samesite=lax`; },
  removeItem: k => { document.cookie = `${k}=; domain=.wowteach.ru; path=/; max-age=0; secure; samesite=lax`; }
};
const sb = location.hostname.endsWith('.wowteach.ru')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: cookieStore } })
  : window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let captchaToken = null;
function onCaptcha(t){ captchaToken = t; }

let currentCourse = null, currentCourseData = null;
let edFiles = {};   // { blockId: [ {file, path, name, size, type, uploaded} ] }

// ============ Вход ============
document.addEventListener('DOMContentLoaded', init);
let sessionReady = false;
let dirty = false;   // есть несохранённые изменения на экране пробника/задания

// защита от случайного закрытия вкладки / перезагрузки
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});
// пометка «есть изменения» — вешаем на ввод в полях
function markDirty(){ dirty = true; }
function clearDirty(){ dirty = false; }

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('login'); return; }
  sessionReady = true;
  const { data: isEditor } = await sb.rpc('learn_is_editor');
  window.__isEditor = !!isEditor;
  document.getElementById('me').innerHTML =
    `<span id="teachNotifBell"></span>${esc(session.user.email)} · <button onclick="logout()">Выйти</button>`;
  renderMainNav();
  if (!window.__isEditor) loadTeacherNotifications();
  route();

  function renderMainNav(){
    const nav = document.getElementById('mainnav');
    const tabs = document.getElementById('mainnavTabs');
    // вкладки по роли
    const items = window.__isEditor
      ? [['','📚 Курсы'],['progress','📊 Прогресс'],['journal','🗂 Журнал'],
         ['certs','🏅 Сертификаты'],['analytics','📈 Аналитика'],['feedback','💬 Отзывы'],['review','✅ Проверка'],['teachers','👥 Досье']]
      : [['','📚 Курсы'],['progress','📊 Прогресс'],['certs','🏅 Сертификаты']];
    tabs.innerHTML = items.map(([route, label]) =>
      `<a class="navtab" data-route="${route}" href="#${route}" onclick="go('${route}');return false">${label}</a>`).join('');
    nav.style.display = 'block';
    highlightNav();
  }                          // открыть экран из текущего хеша
}

// ===== Хеш-роутинг =====
window.addEventListener('hashchange', route);
let pendingHash = null;
function route(){
  if (!sessionReady) return;
  // если уходим с урока с несохранёнными изменениями — спросить
  if (dirty && document.getElementById('lesson').style.display === 'block') {
    pendingHash = location.hash;
    // временно вернём прежний хеш, покажем модалку
    history.pushState(null, '', pendingHash);
    showLeaveConfirm();
    return;
  }
  applyRoute();
}
function applyRoute(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const parts = h.split('/').filter(Boolean);
  highlightNav();
  if (parts[0] === 'course' && parts[1]) { openCourse(parts[1], true); return; }
  if (parts[0] === 'map' && parts[1]) { openCourseMap(parts[1]); return; }
  if (parts[0] === 'review') { openReviewCabinet('queue'); return; }
  if (parts[0] === 'teachers') { openReviewCabinet('teachers'); return; }
  if (parts[0] === 'progress') { openProgress(); return; }
  if (parts[0] === 'journal') { openJournal(); return; }
  if (parts[0] === 'certs') { openCerts(); return; }
  if (parts[0] === 'analytics') { openAnalytics(); return; }
  if (parts[0] === 'feedback') { openFeedback(); return; }
  if (parts[0] === 'lesson' && parts[1] && parts[2]) { openLessonRoute(parts[1], parts[2]); return; }
  // прямая ссылка на работу препода: #work/{enrollment_id}/{block_id}[/{откуда}]
  if (parts[0] === 'work' && parts[1] && parts[2]) { openFullWork(parts[1], parts[2], parts[3] || 'direct'); return; }
  showCatalog(true);
}

function highlightNav(){
  const h = location.hash.replace(/^#/, '').split('/')[0];
  document.querySelectorAll('.navtab').forEach(a => {
    const r = a.dataset.route;
    // курсы активны и на главной, и на экране курса/урока/карты
    const active = (r === '' && ['','course','map','lesson'].includes(h)) || (r !== '' && h === r);
    a.classList.toggle('on', active);
  });
}
function go(hash){ location.hash = hash; }

function showLeaveConfirm(){
  let m = document.getElementById('leaveModal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'leaveModal';
    m.innerHTML = `<div class="lm-back"></div>
      <div class="lm-box">
        <div style="font-size:40px">⚠️</div>
        <h2 style="font-size:20px;margin:8px 0">Выйти без отправки?</h2>
        <p style="color:var(--gray);font-size:14.5px;margin-bottom:20px">
          У вас есть заполненные, но <b>не отправленные</b> ответы. Если выйти сейчас, они не сохранятся.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-ghost" onclick="cancelLeave()">Остаться</button>
          <button class="btn" style="background:var(--red)" onclick="confirmLeave()">Выйти без сохранения</button>
        </div>
      </div>`;
    document.body.appendChild(m);
  }
  m.style.display = 'flex';
}
function cancelLeave(){
  document.getElementById('leaveModal').style.display = 'none';
  pendingHash = null;
}
function confirmLeave(){
  document.getElementById('leaveModal').style.display = 'none';
  clearDirty();
  if (pendingHash != null) { location.hash = pendingHash; pendingHash = null; }
  applyRoute();
}

function show(id, noScroll){
  // уходим с урока — гасим таймер пробника, иначе он тикает в фоне
  // и может сработать автосдачей, когда человек уже в другом разделе
  if (id !== 'lesson' && examTimerInterval) {
    clearInterval(examTimerInterval);
    examTimerInterval = null;
  }
  ['login','catalog','course','lesson','map','review'].forEach(k =>
    document.getElementById(k).style.display = k === id ? 'block' : 'none');
  if (!noScroll) window.scrollTo({ top: 0 });
}
async function doLogin(){
  const msg = document.getElementById('loginMsg');
  msg.style.display = 'none';
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim().toLowerCase(),
    password: document.getElementById('pass').value,
    options: { captchaToken }
  });
  if (error) {
    msg.textContent = 'Не получилось войти: проверьте логин и пароль.';
    msg.style.display = 'block';
    if (window.turnstile) { turnstile.reset(); captchaToken = null; }
    return;
  }
  init();
}

function renderLessonAsTeacher(d){
  const body = document.getElementById('reviewBody');
  const blocks = d.blocks || [];
  const grades = d.grades || {};
  const fmt = x => x ? new Date(x).toLocaleString('ru-RU') : '';

  const blocksHtml = blocks.map(b => {
    const p = b.payload || {};
    const subs = b.submissions || [];

    if (b.type === 'video') {
      return `<div class="fw-section"><b style="font-size:15px">🎬 ${esc(p.title || 'Видео')}</b>
        <div style="font-size:13px;color:var(--gray);margin-top:6px">Запись лекции — преподаватель смотрел этот блок.</div></div>`;
    }

    if (b.type === 'text') {
      return `<div class="fw-section">
        <button class="fw-toggle" onclick="const x=this.nextElementSibling;x.style.display=x.style.display==='none'?'block':'none';this.textContent=x.style.display==='none'?'📖 Показать конспект':'📖 Скрыть конспект'">📖 Показать конспект</button>
        <div style="display:none" class="fw-answer">${p.html || ''}</div></div>`;
    }

    if (b.type === 'quiz') {
      const qs = p.questions || [];
      const sub = subs[0];
      const a = (sub && sub.answers) || {};
      const res = a.__results || {};
      const answered = Object.keys(a).filter(k => k !== '__results').length;
      const ok = Object.values(res).filter(v => v === true).length;
      return `<div class="fw-section">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
          <b style="font-size:15px">📝 Тест по лекции</b>
          <span class="fw-auto">${sub ? `${ok} из ${qs.length} верно` : 'не проходил'}</span>
        </div>
        ${!sub ? '<div class="note">Тест не пройден.</div>' : qs.map((q, qi) => {
          const given = a[qi];
          const isOk = res[qi] === true;
          const chosen = Array.isArray(given)
            ? given.map(i => (q.options || [])[i]).filter(Boolean)
            : (given != null ? [String(given)] : []);
          if (q.type === 'text') {
            return `<div class="fw-q">
              <div style="font-weight:700;font-size:14px">${qi+1}. ${esc(q.q)}</div>
              <div class="fw-answer" style="margin-top:6px;white-space:pre-wrap">${esc(chosen[0] || '—')}</div></div>`;
          }
          return `<div class="fw-q">
            <div style="font-weight:700;font-size:14px">${qi+1}. ${esc(q.q)} <span style="color:${isOk?'#15803D':'var(--red)'}">${isOk?'✓':'✗'}</span></div>
            <div style="font-size:13.5px;margin-top:4px">Ответ: <b>${chosen.length?esc(chosen.join(', ')):'—'}</b></div>
            ${!isOk && q.correct ? `<div style="font-size:13px;color:var(--gray);margin-top:2px">Верно: ${esc((q.correct||[]).map(i=>(q.options||[])[i]).filter(Boolean).join(', '))}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    }

    if (b.type === 'task') {
      return `<div class="fw-section">
        <b style="font-size:15px">📋 Домашнее задание</b>
        <div style="margin:8px 0">
          <button class="fw-toggle" onclick="const x=this.nextElementSibling;x.style.display=x.style.display==='none'?'block':'none';this.textContent=x.style.display==='none'?'📄 Показать текст задания':'📄 Скрыть текст задания'">📄 Показать текст задания</button>
          <div style="display:none" class="fw-tasktext">${p.html || ''}</div>
        </div>
        ${subs.length ? subs.map(s => {
          const a = s.answers || {};
          const rich = a.html && String(a.html).trim();
          const text = !rich && (a.text || a.answer) ? String(a.text || a.answer) : '';
          return `<div style="margin-top:10px">
            <div style="font-size:12px;color:var(--gray);margin-bottom:4px">Отправлено ${fmt(s.submitted_at)}</div>
            ${rich ? `<div class="fw-answer">${a.html}</div>`
              : text ? `<div class="fw-answer" style="white-space:pre-wrap">${esc(text)}</div>`
              : (s.storage_path || (a.files && a.files.length)) ? '<div class="note">Ответ прикреплён файлом.</div>'
              : '<div class="note">Пустой ответ.</div>'}
            ${renderAttachments(a, s)}
          </div>`;
        }).join('') : '<div class="note warn">Преподаватель ничего не прислал.</div>'}
      </div>`;
    }

    if (b.type === 'exam') {
      return `<div class="fw-section">
        <b style="font-size:15px">🧪 Пробник</b>
        <div style="font-size:13.5px;color:var(--gray);margin-top:6px">Ответы пробника удобнее смотреть на экране проверки — там баллы и записи по каждому заданию.</div>
        <div style="margin-top:10px"><button class="btn" style="padding:10px 20px;font-size:14px"
          onclick="openFullWork('${d.enrollment_id}','${b.id}','progress')">Открыть работу для проверки →</button></div>
      </div>`;
    }

    return '';
  }).join('');

  const status = d.done_at
    ? `<span class="tp-flag ok">✅ сдан ${new Date(d.done_at).toLocaleDateString('ru-RU')}</span>`
    : d.started_at ? '<span class="tp-flag warn">🔸 в процессе</span>' : '<span class="tp-flag">не начат</span>';

  body.innerHTML = `
    <button class="btn btn-ghost" style="margin-bottom:16px;padding:8px 16px;font-size:13px" onclick="backFromFullWork()">← Назад</button>
    <h1 style="font-size:24px;margin-bottom:4px">${esc(d.lesson || '')}</h1>
    <p style="color:var(--gray);margin-bottom:8px">${esc(d.teacher || '')} · ${esc(d.course || '')}</p>
    <div style="margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap">${status}
      ${d.revision_open ? '<span class="tp-flag warn">✏️ на доработке</span>' : ''}
      ${d.exam_reviewed ? '<span class="tp-flag ok">проверено</span>' : ''}</div>
    <div class="note" style="margin-bottom:16px">👁 Урок показан так, как его видел преподаватель, вместе с его ответами.</div>
    ${blocksHtml}`;
}

let progressSearch = '';
function renderProgressOverview(rows){

        if (r.has_overdue) flags.push('<span class="tp-flag bad">⚠️ просрочка</span>');
        if (r.has_pending) flags.push('<span class="tp-flag warn">⏳ на проверке</span>');
        if (r.has_suspended) flags.push('<span class="tp-flag bad">🚫 приостановлен</span>');
        if (r.completed_count === r.courses_count && r.courses_count>0) flags.push('<span class="tp-flag ok">✅ всё пройдено</span>');
        return `<div class="tp-item">
          <div class="tp-head" onclick="toggleTp(${i})">
            <div style="flex:1;min-width:150px">
              <div style="font-weight:700">${esc(r.teacher)}</div>
              <div style="font-size:12px;color:var(--gray)">${r.courses_count} ${plural(r.courses_count,'курс','курса','курсов')} · пройдено ${r.completed_count}</div>
            </div>
            <div style="flex:1.3;min-width:110px">
              <div class="tp-bar"><i style="width:${pct}%"></i></div>
              <div style="font-size:11px;color:var(--gray);margin-top:3px">${doneAll}/${totalAll} уроков · ${pct}%</div>
            </div>
            <div style="display:flex;gap:5px;flex-wrap:wrap;flex:1;justify-content:flex-end">${flags.join('')||'<span class="tp-flag">учится</span>'}</div>
            <span class="tp-caret" id="tp-caret-${i}">▸</span>
          </div>
          <div class="tp-body" id="tp-body-${i}" style="display:none">
            ${r.courses.map(c => {
              const cpct = c.total ? Math.round(c.done*100/c.total) : 0;
              const dl = c.deadline ? new Date(c.deadline) : null;
              const overdue = dl && dl < Date.now() && !c.completed;
              let status;
              if (c.completed) status = '<span class="tp-flag ok">🎓 курс завершён</span>';
              else if (c.suspended) status = '<span class="tp-flag bad">🚫 приостановлен</span>';
              else if (c.pending_review) status = '<span class="tp-flag warn">⏳ есть работы на проверке</span>';
              else status = '<span class="tp-flag">учится</span>';
              if (c.revision_open) status += ' <span class="tp-flag warn">✏️ на доработке</span>';
              return `<div class="tp-course">
                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
                  <div style="font-weight:700;font-size:14px">${c.emoji||'📘'} ${esc(c.title)}</div>

                      <span>${done?(ls.pending?'⏳':'✅'):(ls.started_at?'🔸':'⚪️')} ${esc(ls.title)}${ls.has_exam?' 📝':''}</span>

                  }).join('')}
                </div>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}


// завершение курса — решение методиста, а не автоматика
async function finishCourseManually(enrollmentId, title, done, total){
  const warn = (done < total)
    ? `\n\nВнимание: пройдено ${done} из ${total} уроков.`
    : '';
  if (!confirm(`Завершить курс «${title}»?${warn}\n\nБудет выдан сертификат.`)) return;
  const { data, error } = await sb.rpc('learn_finish_course', { p_enrollment_id: enrollmentId });
  if (error) { alert('Не получилось: ' + error.message); return; }

    ? `Курс завершён. Сертификат № ${data.certificate}`

  openProgress();
}

function onJournalCourseChange(){ onJournalModeChange(); }
function onJournalModeChange(){
  const mode = document.getElementById('jf-mode')?.value;
  const courseSel = document.getElementById('jf-course');
  const startInp = document.getElementById('jf-start');
  const hint = document.getElementById('jf-hint');
  if (!hint) return;
  if (mode === 'individual') {
    const dur = courseSel?.selectedOptions[0]?.dataset.dur;
    if (!dur) {
      hint.innerHTML = '⚠️ У выбранного курса не задано «дней на прохождение» — индивидуальный режим недоступен, задайте duration_days курса.';
    } else {
      const start = startInp?.value ? new Date(startInp.value) : new Date();
      const dl = new Date(start.getTime() + dur*86400000);
      hint.innerHTML = `Срок: <b>${dur} дней</b> → дедлайн <b>${dl.toLocaleDateString('ru-RU')}</b>.`;
    }
  } else {
    hint.innerHTML = 'Дедлайны берутся общие из карты курса. Преподаватель идёт в потоке со всеми.';
  }
}

async function submitAssign(){

  if (!teacher || !course) { alert('Выберите преподавателя и курс.'); return; }
  const { data, error } = await sb.rpc('learn_assign_course', {
    p_teacher_id: teacher, p_course_slug: course, p_mode: mode,

  openJournal();
}

function avgOf(rows, key){
  const vals = rows.map(r => r[key]).filter(v => v != null);
  if (!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+Number(b),0) / vals.length);
}

function exportMonthlyCSV(){
  const d = window.__monthlyData;
  if (!d) return;
  const months = d.months || [];
  const courseName = analyticsCourse ? (d.courses.find(c=>c.slug===analyticsCourse)?.title || analyticsCourse) : 'Вся школа';
  const headers = ['Месяц','Преподавателей','Охвачено','% охвата','Назначено','Завершили','Конверсия %','Средний балл %','Средняя длительность, дней'];
  const rows = months.map(m => {
    const cov = m.teachers_eom ? Math.round(m.covered*100/m.teachers_eom) : 0;
    const conv = m.assigned ? Math.round(m.completed*100/m.assigned) : '';
    return [m.label, m.teachers_eom, m.covered, cov, m.assigned, m.completed, conv, m.avg_score??'', m.avg_days??''];
  });
  // BOM для корректной кириллицы в Excel
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Аналитика — ${courseName} — ${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function avgPct(rows, num, den){
  const valid = rows.filter(r => r[den]);
  if (!valid.length) return null;
  const totalNum = valid.reduce((a,r)=>a+Number(r[num]||0),0);
  const totalDen = valid.reduce((a,r)=>a+Number(r[den]||0),0);
  return totalDen ? Math.round(totalNum*100/totalDen) : null;
}
function avgConv(rows){
  const valid = rows.filter(r => r.assigned);
  if (!valid.length) return null;
  const c = valid.reduce((a,r)=>a+Number(r.completed||0),0);
  const a = valid.reduce((x,r)=>x+Number(r.assigned||0),0);
  return a ? Math.round(c*100/a) : null;
}
function avgDays(rows){
  const vals = rows.map(r=>r.avg_days).filter(v=>v!=null);
  if (!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+Number(b),0)/vals.length*10)/10;
}

// ===== Кабинет методиста =====
let reviewTab = 'queue';
async function openReviewCabinet(startTab){
  if (!window.__isEditor) { go(''); return; }
  if (startTab) reviewTab = startTab;
  show('review');
  window.__teachers = null;   // сброс кэша списка преподавателей
  const body = document.getElementById('reviewBody');
  body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--gray)">Загружаю…</div>';
  const [{ data: reviews }, { data: notifs }, { data: unfinished }] = await Promise.all([
    sb.rpc('learn_pending_reviews'),
    sb.rpc('learn_methodist_notifications', { p_limit: 50 }),
    sb.rpc('learn_unfinished_works')
  ]);
  window.__reviews = reviews || [];
  window.__notifs = notifs || [];
  window.__unfinished = unfinished || [];
  if (reviewTab === 'teachers') loadTeachers();
  renderReviewCabinet();
}

function renderReviewCabinet(){
  const body = document.getElementById('reviewBody');
  const reviews = window.__reviews || [];
  const notifs = window.__notifs || [];
  const unread = notifs.filter(n => !n.is_read).length;

  // Досье — отдельный экран (список преподавателей), без под-вкладок проверки
  if (reviewTab === 'teachers') {
    body.innerHTML = `
      <h1 style="font-size:32px;margin-bottom:16px">👥 Досье преподавателей</h1>
      <div id="revContent"></div>`;
    renderReviewContent();
    return;
  }

  // Проверка — очередь + уведомления
  body.innerHTML = `
    <h1 style="font-size:32px;margin-bottom:16px">✅ Проверка работ</h1>
    <div class="rev-tabs">
      <button class="rev-tab ${reviewTab==='queue'?'on':''}" onclick="switchReviewTab('queue')">📋 Очередь (${reviews.length})</button>
      <button class="rev-tab ${reviewTab==='archive'?'on':''}" onclick="switchReviewTab('archive')">✅ Проверенные</button>
      <button class="rev-tab ${reviewTab==='notifs'?'on':''}" onclick="switchReviewTab('notifs')">🔔 Уведомления${unread?` <span class="rev-dot">${unread}</span>`:''}</button>
    </div>
    <div id="revContent"></div>`;
  renderReviewContent();
}


// работы, где задания отправлены, но урок ещё не завершён преподавателем
function renderUnfinished(){
  const list = window.__unfinished || [];
  if (!list.length) return '';
  return `
    <div class="an-section-title" style="margin:26px 0 10px">Ещё не завершили урок (${list.length})</div>
    <div class="note" style="margin-bottom:10px">Преподаватель отправил часть заданий, но не нажал «Завершить урок». На проверку такая работа пока не идёт.</div>
    ${list.map(w => `
      <div class="rev-card" style="opacity:.85">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
          <div>
            <div style="font-weight:700">${esc(w.teacher||'—')}</div>
            <div style="font-size:12.5px;color:var(--gray)">${esc(w.course||'')} · ${esc(w.lesson||'')} · отправлено ${w.sent} ${plural(w.sent,'задание','задания','заданий')}${w.last_at?' · последнее '+new Date(w.last_at).toLocaleDateString('ru-RU'):''}</div>
          </div>
          ${w.block_id?`<button class="btn btn-ghost" style="padding:9px 18px;font-size:13px" onclick="openWorkTab('${w.enrollment_id}','${w.block_id}',event)">Посмотреть →</button>`:''}
        </div>
      </div>`).join('')}`;
}

function switchReviewTab(t){
  reviewTab = t;
  renderReviewCabinet();
  if (t==='notifs') markNotifsRead();
  if (t==='teachers') loadTeachers();
  if (t==='archive') loadReviewedWorks();
}

let archiveSearch = '';
async function loadReviewedWorks(){
  const el = document.getElementById('revContent');
  if (el) el.innerHTML = '<div style="padding:30px;text-align:center;color:var(--gray)">Загружаю проверенные работы…</div>';
  const { data, error } = await sb.rpc('learn_reviewed_works', { p_search: archiveSearch || null, p_limit: 200 });
  if (error) { if (el) el.innerHTML = '<div class="note warn">'+esc(error.message)+'</div>'; return; }
  window.__reviewedWorks = data || [];
  renderReviewContent();
}

async function markNotifsRead(){
  try { await sb.rpc('learn_mark_notifications_read'); } catch(_){}
}

function renderReviewContent(){
  const el = document.getElementById('revContent');
  if (reviewTab === 'teachers') { renderTeachers(el); return; }
  if (reviewTab === 'archive') {
    const works = window.__reviewedWorks;
    if (!works) { el.innerHTML = '<div style="padding:30px;text-align:center;color:var(--gray)">Загружаю…</div>'; return; }
    const search = `<input placeholder="🔍 Поиск по преподавателю или обучению…" value="${esc(archiveSearch)}"
      oninput="archiveSearch=this.value;clearTimeout(window.__archTmr);window.__archTmr=setTimeout(loadReviewedWorks,400)"
      style="width:100%;padding:11px 15px;border:2px solid var(--cream-dark);border-radius:11px;font-size:14px;background:#fff;margin-bottom:14px">`;
    if (!works.length) { el.innerHTML = search + '<div class="note">Проверенных работ пока нет.</div>'; return; }
    el.innerHTML = search + works.map(w => {
      const d = w.reviewed_at ? new Date(w.reviewed_at).toLocaleDateString('ru-RU') : '';
      return `<div class="rev-card">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
          <div>
            <div style="font-weight:800;font-size:16px">${esc(w.teacher||'—')}
              ${w.revision_open?'<span class="teach-chip" style="background:#FEF3E2;color:#B45309;margin-left:6px">✏️ на доработке</span>':''}</div>
            <div style="font-size:12.5px;color:var(--gray)">${w.emoji||'📘'} ${esc(w.course||'')} · ${esc(w.lesson||'')}${d?' · проверена '+d:''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            ${w.total!=null?`<div style="text-align:right"><div style="font-size:18px;font-weight:800">${w.total}<span style="font-size:13px;color:var(--gray)">/${w.max}</span></div>${w.pct!=null?`<div style="font-size:11.5px;color:var(--gray)">${w.pct}%</div>`:''}</div>`:''}
            <button class="btn btn-ghost" style="padding:10px 20px" onclick="openWorkTab('${w.enrollment_id}','${w.block_id}',event)">Посмотреть работу →</button>
          </div>
        </div>
      </div>`;
    }).join('');
    return;
  }
  if (reviewTab === 'queue') {
    const reviews = window.__reviews || [];
    if (!reviews.length) {
      el.innerHTML = '<div class="note ok">🎉 Очередь пуста — все работы проверены.</div>' + renderUnfinished();
      return;
    }
    // группируем по работе: enrollment + block (одна работа = один пробник препода)
    const works = {};
    reviews.forEach(r => {
      const key = r.enrollment_id + '|' + (r.block_id || r.id);
      if (!works[key]) works[key] = { ...r, count: 0, sections: [] };
      works[key].count++;
      works[key].sections.push(r.section_key);
    });
    el.innerHTML = Object.entries(works).map(([key, w]) => {
      const [enr, blk] = key.split('|');
      return `<div class="rev-card">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
          <div>
            <div style="font-weight:800;font-size:16px">${esc(w.student||'—')}</div>
            <div style="font-size:12.5px;color:var(--gray)">${esc(w.course||'')} · ${esc(w.lesson||'')}</div>
            <div style="font-size:12px;color:var(--gray);margin-top:2px">✅ урок сдан целиком${w.lesson_done_at?' · '+new Date(w.lesson_done_at).toLocaleDateString('ru-RU'):''}</div>
          </div>
          <button class="btn" style="padding:10px 22px" onclick="openFullWork('${enr}','${w.block_id||w.id}','queue')">Открыть работу целиком →</button>
        </div>
      </div>`;
    }).join('') + renderUnfinished();
  } else {
    const notifs = window.__notifs || [];
    if (!notifs.length) { el.innerHTML = '<div class="note">Уведомлений пока нет.</div>'; return; }
    el.innerHTML = notifs.map(n => `
      <div class="rev-notif ${n.is_read?'':'unread'}">
        <div style="font-weight:800;font-size:14.5px">${esc(n.title)}</div>
        <div style="font-size:13px;color:var(--gray);margin-top:4px">${esc(n.body||'')}</div>
        <div style="font-size:11.5px;color:var(--gray);margin-top:6px">${new Date(n.created_at).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})} МСК${n.course?' · '+esc(n.course):''}</div>
        ${n.kind==='access_suspended' && n.enrollment_id ? `<button class="btn" style="margin-top:10px;padding:8px 18px;font-size:13px" onclick="resumeAccess('${n.enrollment_id}')">Вернуть доступ</button>` : ''}
      </div>`).join('');
  }
}

function renderReviewCard(r, i){
  const meta = r.meta || {};
  let answerBlock = '';
  if (r.kind === 'writing') {
    const txt = r.answers?.text;
    answerBlock = txt
      ? `<div class="rev-answer">${esc(txt)}</div>`
      : '<div style="font-size:13px;color:var(--gray)">📷 Ответ загружен фото/файлом (см. ниже)</div>';
  } else if (r.kind === 'audio') {
    answerBlock = `<div id="rev-audio-${i}" style="font-size:13px;color:var(--gray)">🎧 Загружаю запись…</div>`;
  } else if (r.kind === 'text') {
    answerBlock = `<div class="rev-answer">${esc(r.answers?.text||'')}</div>`;
  }
  const secLabel = r.section_key ? ` · ${esc(r.section_key)}` : '';
  return `<div class="rev-card" id="rev-card-${i}">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-weight:800;font-size:16px">${esc(r.student||'—')}</div>
        <div style="font-size:12.5px;color:var(--gray)">${esc(r.course||'')} · ${esc(r.lesson||'')}${secLabel}</div>
      </div>
      <div style="font-size:12px;color:var(--gray)">${new Date(r.submitted_at).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})} МСК</div>
    </div>
    ${answerBlock}
    <textarea id="rev-note-${i}" placeholder="Комментарий (необязательно для «Принять», обязателен для «Вернуть»)"
      style="width:100%;min-height:60px;padding:10px 12px;border:2px solid var(--cream-dark);border-radius:10px;font-size:14px;background:#FDFCF8;margin-top:12px;resize:vertical"></textarea>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-green" style="padding:10px 22px" onclick="reviewAct('${r.id}',true,${i})">✓ Принять</button>
      <button class="btn" style="padding:10px 22px;background:var(--orange)" onclick="reviewAct('${r.id}',false,${i})">↩ Вернуть на доработку</button>
    </div>
  </div>`;
}

async function loadReviewAudio(r, i){
  const holder = document.getElementById(`rev-audio-${i}`);
  if (!holder) return;
  const paths = r.meta?.parts?.length ? r.meta.parts : (r.storage_path ? [r.storage_path] : []);
  const urls = [];
  for (const p of paths) {
    try { const { data } = await sb.storage.from('learn-tasks').createSignedUrl(p, 3600);
      if (data?.signedUrl) urls.push(data.signedUrl); } catch(_){}
  }
  holder.innerHTML = urls.length
    ? '🎧 Запись:' + urls.map(u => `<audio controls src="${u}" style="width:100%;margin-top:6px"></audio>`).join('')
    : '<span style="color:var(--gray)">Запись недоступна</span>';
}

async function reviewAct(id, approved, i){
  const note = document.getElementById(`rev-note-${i}`)?.value.trim() || null;
  if (!approved && !note) { alert('Для возврата на доработку добавьте комментарий.'); return; }
  const { error } = await sb.rpc('learn_review_submission', { p_id: id, p_approved: approved, p_note: note });
  if (error) { alert(error.message); return; }
  // убираем карточку из очереди
  window.__reviews = (window.__reviews||[]).filter(r => r.id !== id);
  renderReviewCabinet();
}

async function resumeAccess(enrollmentId){
  if (!confirm('Вернуть доступ к курсу этому преподавателю?')) return;
  const { error } = await sb.rpc('learn_resume_access', { p_enrollment_id: enrollmentId });
  if (error) { alert(error.message); return; }
  alert('Доступ возвращён.');
  openReviewCabinet();
}

// открыть работу в НОВОЙ вкладке по прямой ссылке
function workUrl(enr, blk){
  return location.origin + location.pathname + location.search + '#work/' + enr + '/' + blk;
}
function openWorkTab(enr, blk, ev){
  if (ev) ev.stopPropagation();
  window.open(workUrl(enr, blk), '_blank', 'noopener');
}

async function copyWorkLink(enr, blk, btn){
  const url = workUrl(enr, blk);
  try { await navigator.clipboard.writeText(url); }
  catch(_) { prompt('Скопируйте ссылку:', url); return; }
  if (btn) { const t = btn.textContent; btn.textContent = '✅ Скопировано'; setTimeout(()=>{ btn.textContent = t; }, 1800); }
}

function backFromFullWork(){
  const from = window.__fwReturn || 'queue';
  window.__fwReturn = null;
  if (from === 'progress') { openProgress(); return; }
  if (from === 'archive') { openReviewCabinet('archive'); loadReviewedWorks(); return; }
  openReviewCabinet('queue');
}

// ===== Проверка работы целиком =====
async function openFullWork(enrollmentId, blockId, from){
  window.__fwReturn = from || window.__fwReturn || 'queue';
  show('review');
  const body = document.getElementById('reviewBody');
  body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--gray)">Загружаю работу…</div>';
  const [{ data: full, error }, { data: total }] = await Promise.all([
    sb.rpc('learn_exam_full', { p_enrollment_id: enrollmentId, p_block_id: blockId }),
    sb.rpc('learn_exam_total', { p_enrollment_id: enrollmentId, p_block_id: blockId })
  ]);
  if (error) { body.innerHTML = '<div class="note warn">'+esc(error.message)+'</div>'; return; }
  window.__fullWork = { full, total, enrollmentId, blockId };
  renderFullWork();
}

function taskText(sec){
  const html = sec.intro_html || sec.prompt_html;
  if (!html) return '';
  const id = 'tt-' + Math.random().toString(36).slice(2,9);
  return `<div style="margin:8px 0">
    <button class="fw-toggle" onclick="const b=document.getElementById('${id}');b.style.display=b.style.display==='none'?'block':'none';this.textContent=b.style.display==='none'?'📄 Показать текст задания':'📄 Скрыть текст задания'">📄 Показать текст задания</button>
    <div id="${id}" style="display:none" class="fw-tasktext">${html}</div>
  </div>`;
}

// Экран проверки обычного задания урока (домашки): текст задания + ответ + оценка
function renderHomeworkWork(){
  const { full, enrollmentId, blockId } = window.__fullWork;
  const body = document.getElementById('reviewBody');
  const p = full.payload || {};
  const subs = full.submissions || {};
  const entries = Object.entries(subs);
  // максимум балла: задан в задании либо 100 по умолчанию
  const hwMax = Number(p.max_score) > 0 ? Number(p.max_score) : 100;
  const prev = (full.grades || {})['_task'] || {};
  const hwScore = prev.score != null ? prev.score : hwMax;
  const hwComment = prev.comment ? esc(prev.comment) : '';

  const answersHtml = entries.length ? entries.map(([key, s]) => {
    const a = s.answers || {};
    const when = s.submitted_at ? new Date(s.submitted_at).toLocaleString('ru-RU') : '';

    // ответ может прийти как форматированный текст (html), простой текст или результаты теста
    const rich = a.html && String(a.html).trim();
    const text = !rich && (a.text || a.answer) ? String(a.text || a.answer) : '';
    const res  = a.__results && typeof a.__results === 'object' ? a.__results : null;
    const isQuiz = !rich && !text && res;

    let bodyHtml;
    if (rich) {
      bodyHtml = `<div class="fw-answer">${a.html}</div>`;
    } else if (text) {
      bodyHtml = `<div class="fw-answer" style="white-space:pre-wrap">${esc(text)}</div>`;
    } else if (isQuiz) {
      const vals = Object.values(res);
      const ok = vals.filter(v => v === true).length;
      bodyHtml = `<div class="fw-answer">Тест выполнен автоматически: <b>${ok} из ${vals.length}</b> верно.</div>`;
    } else if (s.storage_path || (a.files && a.files.length)) {
      bodyHtml = '<div class="note">Ответ прикреплён файлом.</div>';
    } else {
      bodyHtml = '<div class="note">Пустой ответ.</div>';
    }

    return `<div class="fw-section">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <b style="font-size:15px">${isQuiz ? 'Тест по лекции' : 'Ответ преподавателя'}</b>
        <span style="font-size:12px;color:var(--gray)">${when}</span>
      </div>
      ${bodyHtml}
      ${renderAttachments(a, s)}
    </div>`;
  }).join('') : '<div class="note warn">Преподаватель ничего не прислал по этому заданию.</div>';

  body.innerHTML = `
    <button class="btn btn-ghost" style="margin-bottom:16px;padding:8px 16px;font-size:13px" onclick="backFromFullWork()">← Назад</button>
    <button class="btn btn-ghost" style="margin-bottom:16px;margin-left:8px;padding:8px 16px;font-size:13px" onclick="copyWorkLink('${enrollmentId}','${blockId}',this)">🔗 Скопировать ссылку</button>

    <h1 style="font-size:26px;margin-bottom:4px">${esc(full.teacher || '—')}</h1>
    <p style="color:var(--gray);margin-bottom:18px">${esc(full.course || '')} · ${esc(full.lesson || '')}</p>

    ${p.html ? `<div style="margin-bottom:16px">
      <button class="fw-toggle" onclick="const b=this.nextElementSibling;b.style.display=b.style.display==='none'?'block':'none';this.textContent=b.style.display==='none'?'📄 Показать текст задания':'📄 Скрыть текст задания'">📄 Показать текст задания</button>
      <div style="display:none" class="fw-tasktext">${p.html}</div>
    </div>` : ''}

    ${answersHtml}

          style="width:110px;padding:11px 14px;border:2px solid var(--cream-dark);border-radius:10px;font-size:16px;font-weight:800;text-align:center;background:#FDFCF8;font-family:inherit">
        <span style="font-size:15px;color:var(--gray)">из ${hwMax}</span>

      <textarea id="hw-comment" placeholder="Комментарий преподавателю: что получилось, что доработать…"
        oninput="this.style.height='auto';this.style.height=Math.max(130,this.scrollHeight+4)+'px'"
        style="width:100%;min-height:130px;padding:12px 14px;border:2px solid var(--cream-dark);border-radius:10px;font-size:14px;line-height:1.55;background:#FDFCF8;margin-top:12px;resize:vertical;font-family:inherit">${hwComment}</textarea>

      <button class="btn btn-ghost" style="font-size:15px;padding:14px 26px" onclick="returnForRevision('${enrollmentId}','${blockId}')">↩ Вернуть на доработку</button>

// вложения ответа: файлы лежат списком в answers.files [{path,name,size,type}]
function renderAttachments(a, sub){
  const files = (a && Array.isArray(a.files)) ? a.files.slice() : [];
  if (sub && sub.storage_path && !files.some(f => f.path === sub.storage_path)) {
    files.push({ path: sub.storage_path, name: 'Прикреплённый файл' });   // старый формат
  }
  if (!files.length) return '';
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
    ${files.map(f => {
      const kb = f.size ? (f.size > 1048576 ? (f.size/1048576).toFixed(1)+' МБ' : Math.round(f.size/1024)+' КБ') : '';
      const icon = /\.(mp4|mov|webm)$/i.test(f.name||'') ? '🎬'
                 : /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name||'') ? '🖼️'
                 : /\.pdf$/i.test(f.name||'') ? '📕'
                 : /\.(doc|docx)$/i.test(f.name||'') ? '📘'
                 : /\.(ppt|pptx)$/i.test(f.name||'') ? '📙' : '📄';
      return `<button class="btn btn-ghost" style="padding:9px 16px;font-size:13px"
        onclick="openSubmissionFile('${esc(f.path)}', this)">${icon} ${esc(f.name||'файл')}${kb?' · '+kb:''}</button>`;
    }).join('')}
  </div>`;
}

async function openSubmissionFile(path, btn){
  if (btn) { btn.disabled = true; btn.textContent = 'Открываю…'; }
  const { data, error } = await sb.storage.from('learn-tasks').createSignedUrl(path, 3600);
  if (btn) { btn.disabled = false; btn.textContent = '📎 Открыть прикреплённый файл'; }
  if (error) { alert('Не удалось открыть файл: ' + error.message); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}

async function finishHomeworkReview(enr, blk, max){
  const comment = (document.getElementById('hw-comment')?.value || '').trim();
  const raw = (document.getElementById('hw-score')?.value || '').trim();
  const score = raw === '' ? null : Number(raw);
  if (score == null || isNaN(score) || score < 0 || score > max) {
    alert(`Поставьте балл от 0 до ${max}.`); return;
  }
  if (!confirm(`Принять работу с баллом ${score} из ${max}?\n\nПреподаватель получит уведомление с оценкой и комментарием.`)) return;
  const { error: gErr } = await sb.rpc('learn_grade_homework',
    { p_enrollment_id: enr, p_block_id: blk, p_score: score, p_comment: comment || null, p_max_score: max });
  if (gErr) { alert('Не получилось: ' + gErr.message); return; }
  const { error } = await sb.rpc('learn_finish_review',
    { p_enrollment_id: enr, p_block_id: blk, p_comment: comment || null });
  if (error) { alert('Балл сохранён, но уведомление не ушло: ' + error.message); }
  alert(`✅ Работа принята. Балл: ${score} из ${max}`);
  backFromFullWork();
}

function renderFullWork(){
  const { full, total, enrollmentId, blockId } = window.__fullWork;
  const body = document.getElementById('reviewBody');
  const p = full.payload || {};
  const subs = full.submissions || {};
  const grades = full.grades || {};
  const secs = p.sections || [];

  // не пробник, а обычное задание урока (домашка) — секций нет
  if (!secs.length) { renderHomeworkWork(); return; }

  let si = -1;
  const sectionsHtml = secs.map(sec => {
    si++;
    const kind = sec.kind;
    if (kind === 'audio') return `<div class="fw-divider">${esc(sec.divider||sec.title||'Аудирование')}</div>`;

    if (kind === 'auto_quiz') {
      const s = subs['quiz_'+si] || {};
      const res = s.results || {};
      const qs = sec.quiz?.questions || [];
      const correct = Object.values(res).filter(v => v===true).length;
      return `<div class="fw-sec">
        ${sec.divider?`<div class="fw-divider">${esc(sec.divider)}</div>`:''}
        <div class="fw-sec-head"><b>${esc(sec.title||'Тест')}</b><span class="fw-auto">авто: ${correct}/${qs.length}</span></div>
        ${taskText(sec)}
        <div style="font-size:13px;margin-top:6px">${qs.map((q,qi)=>{
          const mark = res[qi];
          return `<span class="fw-qmark ${mark===true?'ok':mark===false?'bad':''}">${qi+1}</span>`;
        }).join('')}</div>
      </div>`;
    }
    if (kind === 'exact_input') {
      const s = subs['exact_'+si] || {};
      const ans = s.answers || {};
      const items = sec.items || [];
      return `<div class="fw-sec">
        ${sec.divider?`<div class="fw-divider">${esc(sec.divider)}</div>`:''}
        <div class="fw-sec-head"><b>${esc(sec.title||'Ввод')}</b></div>
        ${taskText(sec)}
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
          ${items.map((it,ii)=>{
            const given = ans[ii]!=null ? (Array.isArray(ans[ii])?ans[ii][0]:ans[ii]) : '—';
            const accepts = Array.isArray(it.accept) ? it.accept : (it.accept ? [it.accept] : []);
            const norm = x => String(x).toUpperCase().replace(/\s/g,'');
            const ok = accepts.some(a => norm(given) === norm(a));
            const correctShow = accepts.join(' / ');
            return `<div style="display:flex;gap:10px;font-size:13.5px">
              <span style="color:var(--gray);min-width:28px">${it.n||ii+1}.</span>
              <span style="font-weight:700;${ok?'color:#15803D':'color:var(--red)'}">${esc(String(given))}</span>
              ${correctShow?`<span style="color:var(--gray)">(верно: ${esc(correctShow)})</span>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }
    if (kind === 'writing') {
      const sk = 'writing_'+si;
      const s = subs[sk] || {};
      const g = grades[sk] || {};
      const txt = s.answers?.text;
      return `<div class="fw-sec">
        ${sec.divider?`<div class="fw-divider">${esc(sec.divider)}</div>`:''}
        <div class="fw-sec-head"><b>${esc(sec.title||'Письмо')}</b><span class="fw-max">макс ${sec.max_score||'—'}</span></div>
        ${taskText(sec)}
        ${txt ? `<div class="rev-answer">${esc(txt)}</div>` : (s.storage_path?`<div id="fw-audio-${sk}" style="font-size:13px;color:var(--gray)">📷 загружаю…</div>`:'<div style="color:var(--gray);font-size:13px">Нет ответа</div>')}
        ${gradeInput(enrollmentId, blockId, sk, sec.max_score, g)}
      </div>`;
    }
    if (kind === 'speaking') {
      return `<div class="fw-sec">
        ${sec.divider?`<div class="fw-divider">${esc(sec.divider)}</div>`:''}
        <div class="fw-sec-head"><b>${esc(sec.title||'Говорение')}</b></div>
        ${taskText(sec)}
        ${(sec.tasks||[]).map(t=>{
          const sk = 'speaking_'+t.id;
          const s = subs[sk] || {};
          const g = grades[sk] || {};
          return `<div class="fw-task">
            <div style="font-weight:700;font-size:14px">${esc(t.label||t.id)} <span class="fw-max">макс ${t.max_score||'—'}</span></div>
            ${(t.prompt_html || t.examiner_html || (t.images&&t.images.length) || t.image) ? `<div style="margin:6px 0"><button class="fw-toggle" onclick="const b=this.nextElementSibling;b.style.display=b.style.display==='none'?'block':'none';this.textContent=b.style.display==='none'?'📄 Показать задание':'📄 Скрыть задание'">📄 Показать задание</button><div style="display:none" class="fw-tasktext">${t.prompt_html||''}${t.examiner_html?`<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--cream-dark)">${t.examiner_html}</div>`:''}${(() => { const il = t.images || (t.image?[t.image]:[]); return il.length ? `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">${il.map(p=>`<img src="${esc(mediaUrl(p))}" style="flex:1;min-width:200px;max-width:100%;border-radius:10px;border:1px solid var(--cream-dark)">`).join('')}</div>` : ''; })()}</div></div>` : ''}
            ${(s.meta?.parts?.length||s.storage_path)?`<div id="fw-audio-${sk}" style="margin-top:8px;font-size:13px;color:var(--gray)">🎧 загружаю запись…</div>`:'<div style="color:var(--gray);font-size:13px;margin-top:6px">Нет записи</div>'}
            ${gradeInput(enrollmentId, blockId, sk, t.max_score, g)}
          </div>`;
        }).join('')}
      </div>`;
    }
    if (kind === 'reflection') {
      const s = subs['reflection_'+si] || subs['reflection'] || {};
      return `<div class="fw-sec">
        ${sec.divider?`<div class="fw-divider">${esc(sec.divider)}</div>`:''}
        <div class="fw-sec-head"><b>${esc(sec.title||'Рефлексия')}</b></div>
        ${s.answers?.text?`<div class="rev-answer">${esc(s.answers.text)}</div>`:'<div style="color:var(--gray);font-size:13px">Нет ответа</div>'}
      </div>`;
    }
    return '';
  }).join('');

  body.innerHTML = `
    <button class="btn btn-ghost" style="margin-bottom:16px;padding:8px 16px;font-size:13px" onclick="backFromFullWork()">← Назад</button>
    <button class="btn btn-ghost" style="margin-bottom:16px;margin-left:8px;padding:8px 16px;font-size:13px" onclick="copyWorkLink('${enrollmentId}','${blockId}',this)">🔗 Скопировать ссылку</button>
    <div class="fw-header">
      <div>
        <h1 style="font-size:26px;margin:0">${esc(full.teacher||'—')}</h1>
        <div style="font-size:13px;color:var(--gray)">${esc(full.course||'')} · ${esc(p.title||'Пробник')}</div>
      </div>
      <div class="fw-total" id="fw-total">
        <div class="fw-total-num">${total?total.total:0} / ${total?total.max:'—'}</div>
        <div style="font-size:11.5px;color:var(--gray)">авто ${total?total.auto:0} + ручной ${total?total.manual:0}</div>
      </div>
    </div>
    ${sectionsHtml}
    <div class="fw-finish">
      <div style="font-size:13.5px;color:var(--gray);margin-bottom:10px">Когда выставлены все баллы, завершите проверку — преподаватель получит уведомление и увидит результат.</div>
      <button class="btn" style="font-size:16px;padding:14px 32px" onclick="finishReview('${enrollmentId}','${blockId}')">✅ Завершить проверку и отправить результат</button>
      <button class="btn btn-ghost" style="font-size:15px;padding:14px 26px;margin-left:10px" onclick="returnForRevision('${enrollmentId}','${blockId}')">↩ Вернуть на доработку</button>
    </div>
    <div style="height:40px"></div>`;

  Object.entries(subs).forEach(([sk, s]) => {
    if (s.meta?.parts?.length || s.storage_path) loadFullWorkMedia(sk, s);
  });
  // уже написанные комментарии раскрываем на всю высоту (чтобы не листать в мини-окошке)
  document.querySelectorAll('[id^="gr-comment-"]').forEach(ta => {
    if (ta.value.trim()) { ta.style.height = 'auto'; ta.style.height = Math.max(130, ta.scrollHeight + 4) + 'px'; }
  });
}

function gradeInput(enr, blk, sk, max, g){
  const val = g.score!=null ? g.score : '';
  const cmt = g.comment || '';
  return `<div class="fw-grade">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="font-size:13px;font-weight:700">Балл:</label>
      <input type="number" id="gr-score-${sk}" min="0" max="${max||99}" step="0.5" value="${val}"
        style="width:80px;padding:8px 10px;border:2px solid var(--cream-dark);border-radius:8px;font-size:15px;font-weight:700;background:#FDFCF8">
      <span style="color:var(--gray);font-size:13px">из ${max||'—'}</span>
    </div>
    <textarea id="gr-comment-${sk}" placeholder="Комментарий преподавателю… (что получилось, что доработать)"
      oninput="this.style.height='auto';this.style.height=Math.max(130,this.scrollHeight+4)+'px'"
      style="width:100%;min-height:130px;padding:12px 14px;border:2px solid var(--cream-dark);border-radius:10px;font-size:14px;line-height:1.55;background:#FDFCF8;margin-top:10px;resize:vertical;font-family:inherit">${esc(cmt)}</textarea>
    <button class="btn btn-green" style="padding:7px 18px;font-size:13px;margin-top:8px" onclick="saveGrade('${enr}','${blk}','${sk}',${max||0})">Сохранить балл</button>
  </div>`;
}

async function saveGrade(enr, blk, sk, max){
  const score = parseFloat(document.getElementById('gr-score-'+sk).value);
  const comment = document.getElementById('gr-comment-'+sk).value.trim() || null;
  if (isNaN(score)) { alert('Введите балл.'); return; }
  if (score < 0 || (max && score > max)) { alert('Балл должен быть от 0 до '+max+'.'); return; }
  const btn = event.target;
  const { error } = await sb.rpc('learn_grade_task', {
    p_enrollment_id: enr, p_block_id: blk, p_section_key: sk,
    p_score: score, p_max_score: max||null, p_comment: comment, p_approved: true
  });
  if (error) { alert(error.message); return; }
  const { data: total } = await sb.rpc('learn_exam_total', { p_enrollment_id: enr, p_block_id: blk });
  window.__fullWork.total = total;
  const tEl = document.getElementById('fw-total');
  if (tEl && total) tEl.innerHTML = `<div class="fw-total-num">${total.total} / ${total.max}</div><div style="font-size:11.5px;color:var(--gray)">авто ${total.auto} + ручной ${total.manual}</div>`;
  btn.textContent = '✓ Сохранено'; btn.style.background = 'var(--gray)';
  setTimeout(()=>{ btn.textContent='Сохранить балл'; btn.style.background=''; }, 1500);
}

async function returnForRevision(enr, blk){
  const comment = prompt('Что нужно доработать? (комментарий преподавателю — например, «Не заполнено задание 12 чтения»)\n\nМожно оставить пустым.');
  if (comment === null) return;   // отмена
  const { error } = await sb.rpc('learn_return_for_revision',
    { p_enrollment_id: enr, p_block_id: blk, p_comment: comment || null });
  if (error) { alert('Не получилось: ' + error.message); return; }
  alert('↩ Работа возвращена на доработку. Преподавателю ушло уведомление и письмо. Статус «пройдено» сохранён — статистика не изменится.');
  openReviewCabinet();
}

async function finishReview(enr, blk){
  if (!confirm('Завершить проверку? Преподавателю уйдёт уведомление и письмо с результатом, работа откроется для просмотра.')) return;
  const { error } = await sb.rpc('learn_finish_review', { p_enrollment_id: enr, p_block_id: blk, p_comment: null });
  if (error) { alert(error.message); return; }
  alert('Проверка завершена. Преподаватель уведомлён.');
  backFromFullWork();
}

async function loadTeacherNotifications(){
  const { data } = await sb.rpc('learn_my_notifications');
  const notifs = data || [];
  const unread = notifs.filter(n => !n.is_read).length;
  const bell = document.getElementById('teachNotifBell');
  if (!bell) return;
  bell.innerHTML = `<a href="#" onclick="toggleTeacherNotifs(event)" style="position:relative;margin-right:14px;text-decoration:none;font-size:18px">🔔${unread?`<span style="position:absolute;top:-6px;right:-8px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px">${unread}</span>`:''}</a>`;
  window.__teacherNotifs = notifs;
}

function toggleTeacherNotifs(e){
  e.preventDefault();
  let panel = document.getElementById('teachNotifPanel');
  if (panel) { panel.remove(); return; }
  const notifs = window.__teacherNotifs || [];
  panel = document.createElement('div');
  panel.id = 'teachNotifPanel';
  panel.className = 'notif-panel';
  panel.innerHTML = notifs.length ? notifs.map(n => `
    <div class="notif-item ${n.is_read?'':'unread'}" ${n.course_slug?`onclick="document.getElementById('teachNotifPanel').remove();go('course/${n.course_slug}')" style="cursor:pointer"`:''}>
      <div style="font-weight:800;font-size:13.5px">${esc(n.title)}</div>
      <div style="font-size:12.5px;color:var(--gray);margin-top:3px">${esc(n.body||'')}</div>
      <div style="font-size:11px;color:var(--gray);margin-top:4px">${new Date(n.created_at).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})}</div>
    </div>`).join('') : '<div style="padding:16px;color:var(--gray);font-size:13px">Уведомлений нет.</div>';
  document.body.appendChild(panel);
  sb.rpc('learn_mark_my_notifications_read').then(() => loadTeacherNotifications());
}

async function loadFullWorkMedia(sk, s){
  const holder = document.getElementById('fw-audio-'+sk);
  if (!holder) return;
  const paths = s.meta?.parts?.length ? s.meta.parts : (s.storage_path ? [s.storage_path] : []);
  const urls = [];
  for (const path of paths) {
    try { const { data } = await sb.storage.from('learn-tasks').createSignedUrl(path, 3600);
      if (data?.signedUrl) urls.push({ url: data.signedUrl, path }); } catch(_){}
  }
  if (!urls.length) { holder.innerHTML = '<span style="color:var(--gray)">Файл недоступен</span>'; return; }
  holder.innerHTML = urls.map(u => u.path.match(/\.(png|jpg|jpeg|webp)$/i)
    ? `<img src="${u.url}" style="max-width:100%;border-radius:10px;margin-top:6px">`
    : `<audio controls src="${u.url}" style="width:100%;margin-top:6px"></audio>`).join('');
}

async function loadTeachers(){
  if (window.__teachers) return;   // уже загружены
  const { data } = await sb.rpc('learn_teachers_list');
  window.__teachers = data || [];
  if (reviewTab === 'teachers') renderReviewContent();

let teachFilter = 'all';
let teachSearch = '';

function renderTeachers(el){
  const ts = window.__teachers;
  if (!ts) { el.innerHTML = '<div style="padding:30px;text-align:center;color:var(--gray)">Загружаю…</div>'; return; }

  // применяем поиск и фильтр
  const q = teachSearch.trim().toLowerCase();
  let list = ts.filter(t => !q || (t.name||'').toLowerCase().includes(q) || (t.email||'').toLowerCase().includes(q));
  if (teachFilter === 'pending') list = list.filter(t => t.pending_reviews > 0);
  else if (teachFilter === 'missed') list = list.filter(t => t.missed > 0);
  else if (teachFilter === 'suspended') list = list.filter(t => t.suspended);
  else if (teachFilter === 'done') list = list.filter(t => t.courses_total > 0 && t.courses_done === t.courses_total);
  else if (teachFilter === 'active') list = list.filter(t => t.courses_total > 0 && t.courses_done < t.courses_total);

  const counts = {
    all: ts.length,
    active: ts.filter(t => t.courses_total > 0 && t.courses_done < t.courses_total).length,
    pending: ts.filter(t => t.pending_reviews > 0).length,
    missed: ts.filter(t => t.missed > 0).length,
    suspended: ts.filter(t => t.suspended).length,
    done: ts.filter(t => t.courses_total > 0 && t.courses_done === t.courses_total).length,
  };

  el.innerHTML = `
    <div class="teach-toolbar">
      <input id="teach-search" placeholder="🔍 Поиск по имени или email…" value="${esc(teachSearch)}"
        oninput="teachSearch=this.value;renderReviewContent();document.getElementById('teach-search').focus()"
        style="width:100%;padding:11px 16px;border:2px solid var(--cream-dark);border-radius:12px;font-size:14.5px;background:#fff;margin-bottom:12px">
      <div class="teach-filters">
        ${[['all','Все'],['active','В процессе'],['pending','На проверке'],['missed','С пропусками'],['suspended','Приостановлены'],['done','Завершили']]
          .map(([k,label]) => `<button class="teach-filter ${teachFilter===k?'on':''}" onclick="teachFilter='${k}';renderReviewContent()">${label} ${counts[k]}</button>`).join('')}
      </div>
    </div>
    ${list.length ? `<div class="teach-grid">${list.map(t => teachCard(t)).join('')}</div>`
      : '<div class="note" style="margin-top:16px">Никого не найдено по этому фильтру.</div>'}`;
}

function teachCard(t){
  return `<div class="teach-card" onclick="openDossier('${t.id}')">
      <div style="display:flex;align-items:center;gap:12px">
        ${t.avatar_url ? `<img src="${esc(t.avatar_url)}" class="teach-photo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'teach-ava',textContent:'${esc((t.name||'?').charAt(0))}'}))">`
          : `<div class="teach-ava">${esc((t.name||'?').charAt(0))}</div>`}
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:15px">${esc(t.name||'—')}</div>

        </div>

      </div>
    </div>`;
}

function renderNotes(notes){

  return notes.map(n => `

async function addNote(){

async function delNote(id){
